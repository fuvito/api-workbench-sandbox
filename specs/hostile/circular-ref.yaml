openapi: 3.0.3
info: {title: circular-ref, version: "1"}
servers: [{url: http://localhost:8080/x}]
paths:
  /tree:
    get:
      operationId: getTree
      responses:
        "200":
          description: A tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
    post:
      operationId: postTree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Node" }
      responses:
        "200": { description: ok }
components:
  schemas:
    Node:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        parent: { $ref: "#/components/schemas/Node" }
        children:
          type: array
          items: { $ref: "#/components/schemas/Node" }
