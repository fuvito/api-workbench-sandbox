openapi: 3.0.3
info: {title: discriminator, version: "1"}
servers: [{url: http://localhost:8080/x}]
paths:
  /pet:
    post:
      operationId: postPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pet" }
      responses:
        "200": { description: ok }
components:
  schemas:
    Pet:
      oneOf:
        - { $ref: "#/components/schemas/Cat" }
        - { $ref: "#/components/schemas/Dog" }
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
    Cat:
      type: object
      required: [kind, lives]
      properties:
        kind: { type: string, enum: [cat] }
        lives: { type: integer }
    Dog:
      type: object
      required: [kind, bark]
      properties:
        kind: { type: string, enum: [dog] }
        bark: { type: string }
