openapi: 3.0.3
info:
  title: ok API
  version: 1.0.0
  description: >
    Correct baseline API. Every operation must conform exactly and every
    invalid request is rejected with a declared 4xx response.
    Phase 2 slice: products, orders, projects and tasks (CRUD).
servers:
  - url: http://localhost:8080/ok
tags:
  - name: system
  - name: customers
  - name: settings
  - name: payments
  - name: security
  - name: products
  - name: orders
  - name: projects
  - name: tasks
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products (filter, sort, paginate)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: q
          in: query
          description: Case-insensitive substring of the product name
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: inStock
          in: query
          description: true = stock above zero, false = stock is zero
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, price, -price] }
      responses:
        "200":
          description: Matching products (one page)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
    head:
      operationId: headProducts
      tags: [products]
      summary: Total number of products, headers only
      responses:
        "200":
          description: Headers only
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
    options:
      operationId: optionsProducts
      tags: [products]
      summary: Methods allowed on this resource
      responses:
        "204":
          description: No content
          headers:
            Allow:
              $ref: "#/components/headers/Allow"

  /products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceProduct
      tags: [products]
      summary: Replace a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Partially update product (at least one field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
    head:
      operationId: headProduct
      tags: [products]
      summary: Check that a product exists, headers only
      responses:
        "200":
          description: The product exists
        "404":
          description: Resource does not exist
    options:
      operationId: optionsProduct
      tags: [products]
      summary: Methods allowed on this resource
      responses:
        "204":
          description: No content
          headers:
            Allow:
              $ref: "#/components/headers/Allow"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (filter, paginate)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: productId
          in: query
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Matching orders (one page)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order for a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created (status starts as pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceOrder
      tags: [orders]
      summary: Replace the product and quantity of an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Partially update order (at least one field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPatch"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects (paginate)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Projects (one page)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceProject
      tags: [projects]
      summary: Replace a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Partially update project (at least one field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (its tasks are deleted with it for now)
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the tasks of a project (filter, paginate)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: done
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Tasks of the project (one page)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceTask
      tags: [tasks]
      summary: Replace a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Partially update task (at least one field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers (paginate)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Customers (one page)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        4XX:
          $ref: "#/components/responses/Problem"

  /customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings as a string-to-string map
      responses:
        "200":
          description: The settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: replaceSettings
      tags: [settings]
      summary: Replace all settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: The new settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"

  /version:
    get:
      operationId: getVersion
      tags: [system]
      summary: API version as plain text
      responses:
        "200":
          description: Version string
          content:
            text/plain:
              schema:
                type: string
                example: 1.0.0

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments (paginate)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Payments (one page)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a card or bank payment (oneOf, discriminated by method)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/NotFound"

  /me:
    get:
      operationId: getMe
      tags: [security]
      summary: Current user (bearer token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [security]
      summary: Audit events, read-only (HTTP basic)
      security:
        - basicAuth: []
      responses:
        "200":
          description: Authenticated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /feature-flags:
    get:
      operationId: getFeatureFlags
      tags: [security]
      summary: Feature flags (API key in the query string)
      security:
        - apiKeyQuery: []
      responses:
        "200":
          description: Authenticated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlags"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /partner-status:
    get:
      operationId: getPartnerStatus
      tags: [security]
      summary: Partner status (API key in a header)
      security:
        - apiKeyHeader: []
      responses:
        "200":
          description: Authenticated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Fixed test token: test-token"
    basicAuth:
      type: http
      scheme: basic
      description: "Fixed test credentials: test-user / test-pass"
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Fixed test key: test-api-key"
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: "Fixed test key: test-api-key"

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Number of records to skip
      schema: { type: integer, minimum: 0, default: 0 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, example: p-1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, example: o-1 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, example: pr-1 }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, example: t-1 }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, example: c-1 }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, example: pay-1 }

  headers:
    TotalCount:
      description: Number of records matching the filters, before pagination
      required: true
      schema: { type: integer, minimum: 0 }
    Allow:
      description: Comma-separated list of allowed methods
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Well-formed request that breaks a business rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Problem:
      description: Error in RFC 7807 problem+json form
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    Product:
      type: object
      required: [id, name, price, stock]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, price, stock]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Gadget }
        price: { type: number, minimum: 0, example: 9.99 }
        stock: { type: integer, minimum: 0, example: 10 }
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Renamed }
        price: { type: number, minimum: 0, example: 11.5 }
        stock: { type: integer, minimum: 0, example: 8 }
    ProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: integer }

    OrderStatus:
      type: string
      enum: [pending, paid, shipped, delivered, cancelled]
    Order:
      type: object
      required: [id, productId, quantity, status]
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        status:
          $ref: "#/components/schemas/OrderStatus"
    OrderInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1, example: p-1 }
        quantity: { type: integer, minimum: 1, example: 2 }
    OrderPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        productId: { type: string, minLength: 1, example: p-1 }
        quantity: { type: integer, minimum: 1, example: 3 }
    OrderList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total: { type: integer }

    Project:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Launch }
        description: { type: string, maxLength: 500 }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Renamed }
        description: { type: string, maxLength: 500, example: Updated }
    ProjectList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total: { type: integer }

    Task:
      type: object
      required: [id, projectId, title, done]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        done: { type: boolean }
    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Write docs }
        done: { type: boolean, default: false }
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Renamed task }
        done: { type: boolean, example: true }
    TaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total: { type: integer }

    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }

    Customer:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id: { type: string, readOnly: true }
        email: { type: string, format: email }
        name: { type: string }
        phone:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
        birthDate:
          type: string
          format: date
          nullable: true
        externalRef: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1 }
        preferences:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [email, name]
      properties:
        email: { type: string, format: email, maxLength: 254, example: new@example.com }
        name: { type: string, minLength: 1, maxLength: 100, example: New Customer }
        phone:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          example: "+15550001111"
        birthDate:
          type: string
          format: date
          nullable: true
          example: "1985-03-09"
        externalRef:
          type: string
          format: uuid
          example: 3f2b8c1e-5d4a-4c8e-9a7b-1e2d3c4b5a69
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1 }
          example: [new]
        preferences:
          type: object
          maxProperties: 20
          additionalProperties: { type: string }
          example: { lang: en }
    CustomerList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total: { type: integer }

    Settings:
      type: object
      maxProperties: 20
      additionalProperties: { type: string, maxLength: 200 }
      example: { theme: light, language: en }

    Reference:
      description: An order reference, either a UUID string or a positive integer
      anyOf:
        - type: string
          format: uuid
        - type: integer
          minimum: 1
      example: 42

    CardPaymentInput:
      type: object
      additionalProperties: false
      required: [method, amount, currency, cardLast4]
      properties:
        method: { type: string, enum: [card] }
        amount: { type: number, minimum: 0.01 }
        currency: { $ref: "#/components/schemas/Currency" }
        cardLast4: { type: string, pattern: '^[0-9]{4}$' }
        reference: { $ref: "#/components/schemas/Reference" }
    BankPaymentInput:
      type: object
      additionalProperties: false
      required: [method, amount, currency, iban]
      properties:
        method: { type: string, enum: [bank] }
        amount: { type: number, minimum: 0.01 }
        currency: { $ref: "#/components/schemas/Currency" }
        iban: { type: string, pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}$' }
        reference: { $ref: "#/components/schemas/Reference" }
    PaymentInput:
      oneOf:
        - $ref: "#/components/schemas/CardPaymentInput"
        - $ref: "#/components/schemas/BankPaymentInput"
      discriminator:
        propertyName: method
        mapping:
          card: "#/components/schemas/CardPaymentInput"
          bank: "#/components/schemas/BankPaymentInput"
      example:
        method: card
        amount: 19.99
        currency: USD
        cardLast4: "4242"
        reference: 42

    Currency:
      type: string
      enum: [USD, EUR, GBP]

    PaymentCommon:
      type: object
      required: [id, amount, currency, status]
      properties:
        id: { type: string }
        amount: { type: number }
        currency: { $ref: "#/components/schemas/Currency" }
        status: { type: string, enum: [authorized] }
        reference: { $ref: "#/components/schemas/Reference" }
    CardPayment:
      allOf:
        - $ref: "#/components/schemas/PaymentCommon"
        - type: object
          required: [method, cardLast4]
          properties:
            method: { type: string, enum: [card] }
            cardLast4: { type: string }
    BankPayment:
      allOf:
        - $ref: "#/components/schemas/PaymentCommon"
        - type: object
          required: [method, iban]
          properties:
            method: { type: string, enum: [bank] }
            iban: { type: string }
    Payment:
      oneOf:
        - $ref: "#/components/schemas/CardPayment"
        - $ref: "#/components/schemas/BankPayment"
      discriminator:
        propertyName: method
        mapping:
          card: "#/components/schemas/CardPayment"
          bank: "#/components/schemas/BankPayment"
    PaymentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total: { type: integer }

    Me:
      type: object
      required: [user, scopes]
      properties:
        user: { type: string }
        scopes:
          type: array
          items: { type: string }
    AuditEvent:
      type: object
      required: [id, action, actor, at]
      properties:
        id: { type: string }
        action: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
    AuditEventList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total: { type: integer }
    FeatureFlags:
      type: object
      additionalProperties: { type: boolean }
    PartnerStatus:
      type: object
      required: [partner, status]
      properties:
        partner: { type: string }
        status: { type: string, enum: [active] }
