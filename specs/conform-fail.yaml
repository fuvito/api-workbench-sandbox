openapi: 3.0.3
info:
  title: conform-fail API
  version: 1.0.0
  description: Request, probe, run and behavior failures. Cases are added in Phase 4.
servers:
  - url: http://localhost:8080/conform-fail
paths:
  /health:
    get:
      operationId: getHealth
      summary: Readiness probe (control case, conforms)
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
