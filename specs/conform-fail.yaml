openapi: 3.0.3
info:
  title: conform-fail API
  version: 1.0.0
  description: >
    Request, probe, run and behavior failures for ClearSignal's Spec Conformance Testing.
    Unlike contract-fail, the responses here are mostly fine; what is wrong is the server's
    behavior as a whole or the run itself. Every operation declares the CORRECT behavior.
    The expected ClearSignal outcome of each case is recorded in expectations/conform-fail.yaml.

    Slice 1 (this file so far): a LENIENT server that accepts requests it should reject
    (found by `clrsig conform --negative`), and a STRICT control group that rejects them.
    Fixed fake credential for the secured operations: bearer token test-token.
servers:
  - url: http://localhost:8080/conform-fail
tags:
  - name: system
  - name: lenient
    description: The server accepts bad requests it should reject
  - name: strict
    description: Control group - the same shapes, correctly rejecting bad requests
  - name: disagreement
    description: The spec and the server disagree about what exists
  - name: instability
    description: Slow, flaky, throttled, unavailable and otherwise unstable behavior
  - name: rules
    description: Business rules the server breaks, visible only to scenario assertions
  - name: drift
    description: Behavior that depends on the drift level set at startup
  - name: requests
    description: Correct operations whose outcome depends on the environment file ClearSignal is given
  - name: hostile
    description: Odd and malformed response bodies and HTTP shapes, one thing each
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Readiness probe (control case, conforms)
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  # ------------------------------------------------------------------ lenient
  /lenient/missing-field:
    post:
      operationId: lenientMissingField
      tags: [lenient]
      summary: Accepts a body without the required field
      description: The spec requires name. The server checks types but accepts a body that lacks it (201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /lenient/wrong-type:
    post:
      operationId: lenientWrongType
      tags: [lenient]
      summary: Accepts a field of the wrong type
      description: The spec declares quantity as an integer. The server requires it but accepts "lots" (201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantityBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /lenient/missing-query:
    get:
      operationId: lenientMissingQuery
      tags: [lenient]
      summary: Answers without a required query parameter
      description: The spec requires q. The server answers 200 without it.
      parameters:
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          $ref: "#/components/responses/Echo"
        "400":
          $ref: "#/components/responses/BadRequest"

  /lenient/no-auth:
    get:
      operationId: lenientNoAuth
      tags: [lenient]
      summary: Answers without credentials on a secured operation
      description: The spec requires a bearer token. The server answers 200 without any credentials.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lenient/wrong-auth:
    get:
      operationId: lenientWrongAuth
      tags: [lenient]
      summary: Accepts any token
      description: >
        Rejects a missing token (401) but accepts any token value. ClearSignal does not probe
        wrong credentials today (CS-GAP-008), so this passes.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lenient/enum-and-boundary:
    post:
      operationId: lenientEnumAndBoundary
      tags: [lenient]
      summary: Accepts values outside an enum and a maximum
      description: >
        level must be low or high and percent at most 100. The server checks presence and
        types but accepts level "extreme" and percent 5000. Not probed today (CS-GAP-009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /lenient/unknown-fields:
    post:
      operationId: lenientUnknownFields
      tags: [lenient]
      summary: Accepts fields the closed schema does not allow
      description: >
        The schema sets additionalProperties false. The server accepts extra fields.
        Not probed today (CS-GAP-009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosedBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ------------------------------------------------------------------- strict
  /strict/missing-field:
    post:
      operationId: strictMissingField
      tags: [strict]
      summary: Control - rejects a body without the required field
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /strict/wrong-type:
    post:
      operationId: strictWrongType
      tags: [strict]
      summary: Control - rejects a field of the wrong type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantityBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /strict/missing-query:
    get:
      operationId: strictMissingQuery
      tags: [strict]
      summary: Control - rejects a request without the required query parameter
      parameters:
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          $ref: "#/components/responses/Echo"
        "400":
          $ref: "#/components/responses/BadRequest"

  /strict/no-auth:
    get:
      operationId: strictNoAuth
      tags: [strict]
      summary: Control - rejects a request without credentials
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /strict/wrong-auth:
    get:
      operationId: strictWrongAuth
      tags: [strict]
      summary: Control - rejects a wrong token as well as a missing one
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /strict/enum-and-boundary:
    post:
      operationId: strictEnumAndBoundary
      tags: [strict]
      summary: Control - rejects values outside the enum and the maximum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /strict/unknown-fields:
    post:
      operationId: strictUnknownFields
      tags: [strict]
      summary: Control - rejects fields the closed schema does not allow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosedBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ------------------------------------------- spec and server disagree (slice 2)
  /ghost:
    get:
      operationId: ghostRoute
      tags: [disagreement]
      summary: Declared in the spec, no such route on the server
      description: The spec declares GET /ghost (200). The server has no route and answers 404, which the spec does not declare.
      responses:
        "200":
          description: A thing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdDoc"

  /orphan:
    delete:
      operationId: orphanOperation
      tags: [disagreement]
      summary: Declared operation whose method the server does not implement
      description: The spec declares DELETE /orphan (204). The server only implements POST /orphan, so DELETE answers 405.
      responses:
        "204":
          description: Deleted

  /wrong-method:
    patch:
      operationId: wrongMethod
      tags: [disagreement]
      summary: The spec says PATCH, the server only accepts PUT
      description: The spec declares PATCH /wrong-method (200). The server implements PUT /wrong-method only, so PATCH answers 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkDoc"

  /path-param/{id}:
    get:
      operationId: pathParamType
      tags: [disagreement]
      summary: The spec says id is an integer, the server only accepts UUIDs
      description: ClearSignal builds an integer id from the environment; the server answers 400, which the spec does not declare.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        "200":
          description: A thing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdDoc"

  /requires-extra-header:
    post:
      operationId: requiresExtraHeader
      tags: [disagreement]
      summary: The server needs a header the spec never mentions
      description: The server requires X-Tenant and answers 400 without it. The spec declares neither the header nor the 400.
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /form:
    post:
      operationId: formBody
      tags: [disagreement]
      summary: A form-encoded request body
      description: >
        ClearSignal generates requests without a body for form bodies (CS-GAP-006), so the server
        receives none and answers 400, which the spec declares. Passes today; pins the gap.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NameBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /multipart:
    post:
      operationId: multipartBody
      tags: [disagreement]
      summary: A multipart request body
      description: Same as /form, for multipart/form-data (CS-GAP-006). Passes today; pins the gap.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/NameBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /subscribe:
    post:
      operationId: subscribe
      tags: [disagreement]
      summary: Register a callback URL (the spec also describes a callback)
      description: >
        The callback below is not under paths, so ClearSignal does not exercise it (CS-GAP-010).
        The server never contacts the callback URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
      callbacks:
        onEvent:
          "{$request.body#/callbackUrl}":
            post:
              operationId: onEventCallback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/EventDoc"
              responses:
                "200":
                  description: Acknowledged

  # ------------------------------ requests built from spec + environment (slice 3)
  /requests/param-type/{itemId}:
    get:
      operationId: requestParamType
      tags: [requests]
      summary: A correct operation with an integer path parameter
      description: >
        Correct on its own: it answers 200 for a numeric id and a declared 400 otherwise. Run it
        with the right environment (itemId=7) and it passes; with a wrong one (itemId=abc) the
        request ClearSignal builds does not fit the spec (CS-REQ-001), and with none the request
        is not sent (CS-RUN-001).
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdDoc"
        "400":
          $ref: "#/components/responses/BadRequest"

  /requests/body-value:
    post:
      operationId: requestBodyValue
      tags: [requests]
      summary: A correct operation whose body value comes from the environment
      description: >
        amount has no example, so ClearSignal fills it from the environment variable of the same
        name. With amount=19.99 the operation passes; with amount=cheap the generated body does
        not fit the schema (CS-REQ-002).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ----------------------------------------- timing and instability (slice 4)
  # Every state-dependent behavior below is a counter held in this family's store: POST
  # /conform-fail/__admin/reset restores it. Nothing runs in the background.

  /slow:
    get:
      operationId: slow
      tags: [instability]
      summary: Waits longer than ClearSignal's default timeout
      description: >
        Answers after 15 seconds (times LATENCY_SCALE). With the default 10 second timeout the request times out (CS-RUN-003).
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /flaky:
    get:
      operationId: flaky
      tags: [instability]
      summary: Fails every 3rd call with 500, otherwise correct
      description: >
        The 500 is not declared in the spec (CS-RESP-001). A run that passes sometimes; reset restores the counter.
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /rate-limited:
    get:
      operationId: rateLimited
      tags: [instability]
      summary: Answers 429 after 3 calls
      description: >
        The 429 is not declared in the spec (CS-RESP-001). Counter based, so deterministic; reset restores it.
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /latency/{ms}:
    get:
      operationId: latencyFixed
      tags: [instability]
      summary: Answers correctly after exactly ms milliseconds
      description: >
        ms is capped at 30000. Nothing fails unless the client timeout is shorter; ClearSignal does not measure response time (CS-GAP-005).
      parameters:
        - name: ms
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 30000 }
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"
        "400":
          $ref: "#/components/responses/BadRequest"

  /latency/jitter:
    get:
      operationId: latencyJitter
      tags: [instability]
      summary: Answers after a delay between min and max
      description: >
        The delays are a fixed pseudo-random sequence (seeded), so a run after reset sees the same delays every time.
      parameters:
        - name: min
          in: query
          schema: { type: integer, minimum: 0, maximum: 30000, default: 100 }
        - name: max
          in: query
          schema: { type: integer, minimum: 0, maximum: 30000, default: 1000 }
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"
        "400":
          $ref: "#/components/responses/BadRequest"

  /latency/degrading:
    get:
      operationId: latencyDegrading
      tags: [instability]
      summary: Every call is slower than the last
      description: >
        The delay grows by 300 ms per call from 100 ms, capped at 5 s. Reset restores the first call.
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /unavailable:
    get:
      operationId: unavailable
      tags: [instability]
      summary: Always 503 with Retry-After
      description: >
        The 503 is not declared in the spec (CS-RESP-001).
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /unavailable-then-ok:
    get:
      operationId: unavailableThenOk
      tags: [instability]
      summary: 503 for the first 2 calls after reset, then correct
      description: >
        The 503 is not declared in the spec (CS-RESP-001) while it lasts.
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /redirect-loop:
    get:
      operationId: redirectLoop
      tags: [instability]
      summary: Redirects to itself
      description: >
        Only ever redirects to its own path, never elsewhere. ClearSignal stops after too many redirects.
      responses:
        "200":
          description: A correct answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /large:
    get:
      operationId: large
      tags: [instability]
      summary: A body of mb megabytes
      description: >
        mb is capped at 60. ClearSignal reads at most 50 MB of a response. Cloud Run does not pass
        responses this large, so the cases above 32 MB are local only.
      parameters:
        - name: mb
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 60 }
      responses:
        "200":
          description: Bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /large/json:
    get:
      operationId: largeJson
      tags: [instability]
      summary: A JSON body of about mb megabytes
      description: >
        A valid JSON object whose single string is mb megabytes long. ClearSignal reads at most
        50 MB of a response, so above that the body it sees is cut off in the middle.
      parameters:
        - name: mb
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 60 }
      responses:
        "200":
          description: A JSON object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BigDoc"
        "400":
          $ref: "#/components/responses/BadRequest"

  /timeout/hang:
    get:
      operationId: timeoutHang
      tags: [instability]
      summary: Accepts the request and does not answer
      description: >
        Waits 30 seconds (times LATENCY_SCALE) before answering. Local only until verified on Cloud Run.
      responses:
        "200":
          description: A correct answer, if one ever arrives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /timeout/slow-headers:
    get:
      operationId: timeoutSlowHeaders
      tags: [instability]
      summary: Waits before sending any headers
      description: >
        Sends nothing for 4 seconds (times LATENCY_SCALE), then answers. Local only until verified on Cloud Run.
      responses:
        "200":
          description: A correct answer, if one ever arrives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /timeout/slow-body:
    get:
      operationId: timeoutSlowBody
      tags: [instability]
      summary: Sends headers at once, then trickles the body
      description: >
        50 bytes at 5 per second, 10 seconds in all (times LATENCY_SCALE). Local only until verified on Cloud Run.
      responses:
        "200":
          description: A correct answer, if one ever arrives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /timeout/truncated-body:
    get:
      operationId: timeoutTruncatedBody
      tags: [instability]
      summary: Declares Content-Length 1000, sends 100 bytes and closes
      description: >
        The connection is closed before the declared body is complete. Local only until verified on Cloud Run.
      responses:
        "200":
          description: A correct answer, if one ever arrives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /timeout/connection-reset:
    get:
      operationId: timeoutConnectionReset
      tags: [instability]
      summary: Closes the connection without answering
      description: >
        A TCP reset with no response bytes. Local only until verified on Cloud Run.
      responses:
        "200":
          description: A correct answer, if one ever arrives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingDoc"

  /drift/report:
    get:
      operationId: driftReport
      tags: [drift]
      summary: Correct at drift 0, broken at drift 1 or higher
      description: >
        At drift 0 (the default) total is an integer. Started with --drift=1 (or DRIFT=1) the
        server answers total as a string, one new violation (CS-RESP-006) for the baseline ratchet
        (CS-RUN-006). The level is fixed at startup.
      responses:
        "200":
          description: A report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftDoc"

  /timeout/after-write:
    post:
      operationId: timeoutAfterWrite
      tags: [instability]
      summary: Does the write, then waits past the client timeout
      description: >
        The record is stored first and the answer comes 15 seconds later (times LATENCY_SCALE).
        A client that times out and retries creates a duplicate.
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /timeout/after-write/records:
    get:
      operationId: timeoutAfterWriteRecords
      tags: [instability]
      summary: The records written by /timeout/after-write
      responses:
        "200":
          $ref: "#/components/responses/Records"

  /idempotent:
    post:
      operationId: idempotentCreate
      tags: [instability]
      summary: Should treat a repeated Idempotency-Key as the same request
      description: >
        BUG ON PURPOSE: a repeated Idempotency-Key creates a second record. Only visible in a
        scenario with two steps.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /idempotent/records:
    get:
      operationId: idempotentRecords
      tags: [instability]
      summary: The records created by /idempotent
      responses:
        "200":
          $ref: "#/components/responses/Records"

  /lost-update:
    get:
      operationId: lostUpdateGet
      tags: [instability]
      summary: The current value and its ETag
      responses:
        "200":
          description: The value
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueDoc"
    put:
      operationId: lostUpdatePut
      tags: [instability]
      summary: Should refuse a stale If-Match
      description: >
        BUG ON PURPOSE: the server ignores If-Match, so two writers with the same stale ETag both
        succeed and the second silently overwrites the first. Only visible in a scenario.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, example: "*" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueBody"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueDoc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "412":
          $ref: "#/components/responses/BadRequest"
        "428":
          $ref: "#/components/responses/BadRequest"

  # ------------------------------ business rules the server breaks (slice 5)
  # Each operation declares the CORRECT rule (a 409 or 422 or 401 the spec lists); the server breaks
  # exactly that rule. Only scenario assertions on the rule see it: the contract checks are fine.
  /rules/stock:
    get:
      operationId: rulesStock
      tags: [rules]
      summary: The stock left (starts at 5; must never go below zero)
      responses:
        "200":
          description: The stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDoc"

  /rules/orders:
    post:
      operationId: rulesCreateOrder
      tags: [rules]
      summary: Create an order (an order above the stock must be refused with 422)
      description: >
        RULE BROKEN: the server accepts any quantity and the stock goes negative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleOrderBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/BadRequest"

  /rules/orders/{orderId}/ship:
    post:
      operationId: rulesShipOrder
      tags: [rules]
      summary: Ship an order (pending to shipped)
      parameters:
        - $ref: "#/components/parameters/RuleOrderId"
      responses:
        "200":
          description: Shipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOrder"
        "404":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/BadRequest"

  /rules/orders/{orderId}/cancel:
    post:
      operationId: rulesCancelOrder
      tags: [rules]
      summary: Cancel an order (a shipped order must be refused with 409)
      description: >
        RULE BROKEN: cancelling a shipped order answers 200 and the order becomes cancelled.
      parameters:
        - $ref: "#/components/parameters/RuleOrderId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOrder"
        "404":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/BadRequest"

  /rules/customers:
    post:
      operationId: rulesCreateCustomer
      tags: [rules]
      summary: Register a customer (a duplicate email must be refused with 409)
      description: >
        RULE BROKEN: a second customer with the same email is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCustomerBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDoc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/BadRequest"

  /rules/withdrawals:
    post:
      operationId: rulesWithdraw
      tags: [rules]
      summary: Withdraw money (more than the balance must be refused with 422)
      description: >
        RULE BROKEN: insufficient funds are answered 200 with an error body instead of 422. The
        example amount (500) is above the balance (100), so ClearSignal's own request triggers it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalBody"
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalDoc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/BadRequest"

  /rules/items:
    get:
      operationId: rulesItems
      tags: [rules]
      summary: Offset pagination (a page must never repeat the previous page's last item)
      description: >
        RULE BROKEN: serving the first page makes another writer add an item at the head of the
        list, so the second page repeats an item. Only visible in a scenario with two steps.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 3 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleItems"
        "400":
          $ref: "#/components/responses/BadRequest"

  /rules/protected:
    get:
      operationId: rulesProtected
      tags: [rules]
      summary: Needs a valid bearer token (an expired token must be refused with 401)
      description: >
        RULE BROKEN: the token expired-token is accepted although it expired. Fixed fake tokens:
        valid-token and expired-token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The protected data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretDoc"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hostile/deep-nesting:
    get:
      operationId: hostileDeepNesting
      tags: [hostile]
      summary: "JSON nested 200 levels deep (valid)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/wide-object:
    get:
      operationId: hostileWideObject
      tags: [hostile]
      summary: "A JSON object with 20000 keys (valid)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/unicode:
    get:
      operationId: hostileUnicode
      tags: [hostile]
      summary: "Accents, Hebrew, an emoji, an escaped surrogate pair and an escaped NUL (valid)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/integer-as-float:
    get:
      operationId: hostileIntegerAsFloat
      tags: [hostile]
      summary: "id is 1.0: an integer in JSON Schema (valid)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/integer-exponent:
    get:
      operationId: hostileIntegerExponent
      tags: [hostile]
      summary: "id is 1e2: an integer in JSON Schema (valid)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/big-integer:
    get:
      operationId: hostileBigInteger
      tags: [hostile]
      summary: "id is 9223372036854775808, one above int64 (valid for an unbounded integer)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/negative-zero:
    get:
      operationId: hostileNegativeZero
      tags: [hostile]
      summary: "id is -0 (valid)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/bom:
    get:
      operationId: hostileBom
      tags: [hostile]
      summary: "A UTF-8 byte order mark before the JSON (RFC 8259: a parser MAY ignore it)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/invalid-utf8:
    get:
      operationId: hostileInvalidUtf8
      tags: [hostile]
      summary: "A string containing the bytes ff fe (not valid UTF-8, so not valid JSON)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/raw-newline-in-string:
    get:
      operationId: hostileRawNewlineInString
      tags: [hostile]
      summary: "A raw line feed inside a string (not valid JSON)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/nan-literal:
    get:
      operationId: hostileNanLiteral
      tags: [hostile]
      summary: "id is NaN (not valid JSON)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/trailing-garbage:
    get:
      operationId: hostileTrailingGarbage
      tags: [hostile]
      summary: "A valid object followed by the text garbage (not valid JSON)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/duplicate-keys:
    get:
      operationId: hostileDuplicateKeys
      tags: [hostile]
      summary: "id appears twice, as 1 and as the string two (RFC 8259: behavior is unpredictable)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/float-overflow:
    get:
      operationId: hostileFloatOverflow
      tags: [hostile]
      summary: "ratio is 1e400, a number no float64 holds (valid JSON)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/lone-surrogate:
    get:
      operationId: hostileLoneSurrogate
      tags: [hostile]
      summary: "A string with an unpaired surrogate escape (valid JSON text, not valid Unicode)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/gzip:
    get:
      operationId: hostileGzip
      tags: [hostile]
      summary: "A valid gzip body with Content-Encoding gzip"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/gzip-lie:
    get:
      operationId: hostileGzipLie
      tags: [hostile]
      summary: "Content-Encoding gzip with a plain body (not gzip)"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/duplicate-headers:
    get:
      operationId: hostileDuplicateHeaders
      tags: [hostile]
      summary: "The same header twice and two Set-Cookie headers"
      responses:
        "200":
          description: A body the case builds byte by byte
          headers:
            X-Dup:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/big-header:
    get:
      operationId: hostileBigHeader
      tags: [hostile]
      summary: "A 60000-byte response header"
      responses:
        "200":
          description: A body the case builds byte by byte
          headers:
            X-Big:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

  /hostile/chunked-stream:
    get:
      operationId: hostileChunkedStream
      tags: [hostile]
      summary: "No Content-Length: the body arrives in three chunks"
      responses:
        "200":
          description: A body the case builds byte by byte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostileDoc"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Fixed test token: test-token"

  parameters:
    Q:
      name: q
      in: query
      required: true
      description: A search text
      schema: { type: string, minLength: 1, example: abc }
    RuleOrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, example: o-1 }

  headers:
    ETag:
      description: Version of the value, for If-Match
      required: true
      schema: { type: string }

  responses:
    Records:
      description: Records written so far
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecordsDoc"
    Created:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreatedDoc"
    Echo:
      description: The query that was understood
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EchoDoc"
    Secret:
      description: Protected data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecretDoc"
    BadRequest:
      description: The request does not fit the spec
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HostileDoc:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        text: { type: string }
        ratio: { type: number }
        nest: {}
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    NameBody:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, example: Widget }
    QuantityBody:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, example: 3 }
    LevelBody:
      type: object
      required: [level, percent]
      properties:
        level: { type: string, enum: [low, high], example: low }
        percent: { type: integer, minimum: 0, maximum: 100, example: 50 }
    ClosedBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, example: Widget }

    CreatedDoc:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    EchoDoc:
      type: object
      required: [q]
      properties:
        q: { type: string }
    SecretDoc:
      type: object
      required: [secret]
      properties:
        secret: { type: string }

    IdDoc:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    OkDoc:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    SubscribeBody:
      type: object
      required: [callbackUrl]
      properties:
        callbackUrl: { type: string, format: uri, example: "https://example.com/hook" }
    EventDoc:
      type: object
      required: [event]
      properties:
        event: { type: string }

    AmountBody:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 0 }

    TimingDoc:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        call: { type: integer }
        delayMs: { type: integer }
    RecordsDoc:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            type: object
    ValueDoc:
      type: object
      required: [value, version]
      properties:
        value: { type: string }
        version: { type: integer }
    ValueBody:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1, example: updated }

    BigDoc:
      type: object
      required: [data]
      properties:
        data: { type: string }

    DriftDoc:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items: { type: string }

    StockDoc:
      type: object
      required: [stock]
      properties:
        stock: { type: integer }
    RuleOrderBody:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, example: 1 }
    RuleOrder:
      type: object
      required: [id, quantity, status]
      properties:
        id: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [pending, shipped, cancelled] }
    RuleCustomerBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, minLength: 3, example: ada@example.com }
    WithdrawalBody:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, example: 500 }
    WithdrawalDoc:
      type: object
      required: [id, balance]
      properties:
        id: { type: string }
        balance: { type: integer, minimum: 0 }
    RuleItems:
      type: object
      required: [items, total]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
