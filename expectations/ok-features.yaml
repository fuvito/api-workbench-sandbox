# Expected ClearSignal outcome for the OpenAPI feature examples of the `ok` API (specs/ok-features.yaml).
#
# One small operation per OpenAPI feature that specs/ok.yaml does not use: parameter styles
# (deepObject, pipeDelimited, spaceDelimited, label, matrix), allowEmptyValue, allowReserved, int64 /
# double / byte / password formats, multipleOf and exclusive bounds, `not`, a deprecated operation,
# a response link, CSV / PNG / NDJSON bodies, a `components.requestBodies` reference, and oauth2 and
# openIdConnect security. The server behaves as the spec says, so every operation ClearSignal runs
# must conform.
#
# The spec declares 19 operations, `TRACE /features/trace` among them. Since v0.8.4 ClearSignal
# generates, runs and counts it (v0.8.3 silently left it out, F-025); `--read-only` skips it.
#
# Run: uv run python scripts/check_expectations.py --expectations expectations/ok-features.yaml   (server on :8080)
#
# Holds for clrsig v0.8.4 against the standard spec (docs/clrsig-findings.md).

format: 1
family: ok-features
spec: specs/ok-features.yaml
prefix: /ok
env: clrsig/environments/ok-features.yaml

whole_spec:
  reset: true
  covers_all: true
  failing:
    - /features/xml-note          # no XML request body is generated: "value is required but missing" (CS-GAP-006)

generation:
  operations: 26

scenarios:
  - file: clrsig/scenarios/ok-features.yaml
    env: clrsig/environments/ok-features.yaml
    steps:
      Reset ok store: { passed: true }
      Create an item: { passed: true }
      Follow the GetItem link: { passed: true }
      Get an access token (client credentials): { passed: true }
      Use the access token: { passed: true }
      No token is refused: { passed: true }
      Label style, written by hand: { passed: true }
      Matrix style, written by hand: { passed: true }
      Deep object, written by hand: { passed: true }
      A reserved word is refused (not): { passed: true }
      CSV content type: { passed: true }
      PNG content type: { passed: true }
      NDJSON content type: { passed: true }

  # What `conform` cannot do (CS-GAP-008 and others): the server has an expired and a read-only token, a session
  # in a cookie and a Link-header list; the scenario walks through them. clrsig keeps no cookie jar between steps
  # (the cookie is sent back by hand) and cannot follow a Link header (the whole header is one extracted value).
  - file: clrsig/scenarios/ok-credentials-and-session.yaml
    env: clrsig/environments/ok-features.yaml
    steps:
      Reset ok store: { passed: true }
      Valid token: { passed: true }
      Unknown token: { passed: true }
      Expired token: { passed: true }
      Read-only token on the write area: { passed: true }
      Writer token on the write area: { passed: true }
      Expired token on the write area: { passed: true }
      Wrong password: { passed: true }
      Log in: { passed: true, extracted: { sessionCookie: "***" }, note: "the whole Set-Cookie header is one value, masked in reports because the name says session" }
      Session without sending the cookie back: { passed: true, note: "no cookie jar: the cookie from the login is not sent again unless the step does it" }
      Session with the cookie sent back by hand: { passed: true }
      Log out: { passed: true }
      The old session is dead: { passed: true }
      First page: { passed: true }
      Last page has no next: { passed: true }
      A page beyond the last is refused: { passed: true }

# Probe kinds as ClearSignal words them in the text report.
probe_kinds:
  "missing required field": CS-PROBE-001
  "wrong type for field": CS-PROBE-002
  "missing required query param": CS-PROBE-003
  "no credentials": CS-PROBE-004

# `conform --negative`: 25 probes over 12 operations. TRACE, the label and matrix paths and the Link list have no body
# or required parameter to break. The credentials and the session cookie get one probe each, "no credentials":
# an expired, unknown or under-privileged credential is never probed (CS-GAP-008), which the scenario covers. The path-style and query-style operations and the
# form-body token endpoint have no body field to drop, so they get no probe.
probes:
  - { op: /features/items, probes: 2, fail: [] }
  - { op: /features/names, probes: 2, fail: [] }
  - { op: /features/notes, probes: 2, fail: [] }
  - { op: /features/numbers, probes: 8, fail: [] }
  - { op: /features/credentials/profile, probes: 1, fail: [] }
  - { op: /features/credentials/write-area, probes: 1, fail: [] }
  - { op: /features/session/login, probes: 4, fail: [] }
  - { op: /features/session/me, probes: 1, fail: [] }
  - { op: /features/oauth2-profile, probes: 1, fail: [] }
  - { op: /features/openid-profile, probes: 1, fail: [] }
  - { op: /features/pipe-delimited, probes: 1, fail: [] }
  - { op: /features/space-delimited, probes: 1, fail: [] }

runs:
  - name: trace-is-not-a-read-only-method
    reference: null
    note: "--read-only lists the TRACE operation as skipped instead of sending it (F-025 closed in v0.8.4); exit 0 since v0.8.6 (the NDJSON operation passes, F-033 closed)"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok-features.yaml", --read-only]
    exit: 0
    output: 'SKIP\s+TRACE\s+/features/trace'

  # ---- reports do not quote what only the response holds (clrsig 0.13.2) ----
  # The token endpoint answers with "test-token". No --env: older releases masked a value only when
  # the environment held it too.
  - name: report-does-not-quote-the-token-text
    reference: CS-RUN-011
    note: "v0.13.2: up to v0.13.1 a response that broke its schema was quoted in full, token included; the report still names the missing field"
    args: [conform, "{root}/clrsig/fixtures/token-endpoint-stricter.yaml", -b, "{fbase}", --format, text]
    exit: 1
    output: 'refresh_token'
    not_output: 'test-token'
  - name: report-does-not-quote-the-token-json
    reference: CS-RUN-011
    note: "v0.13.2: up to v0.13.1 a response that broke its schema was quoted in full, token included; the report still names the missing field"
    args: [conform, "{root}/clrsig/fixtures/token-endpoint-stricter.yaml", -b, "{fbase}", --format, json]
    exit: 1
    output: 'refresh_token'
    not_output: 'test-token'
  - name: report-does-not-quote-the-token-junit
    reference: CS-RUN-011
    note: "v0.13.2: up to v0.13.1 a response that broke its schema was quoted in full, token included; the report still names the missing field"
    args: [conform, "{root}/clrsig/fixtures/token-endpoint-stricter.yaml", -b, "{fbase}", --format, junit]
    exit: 1
    output: 'refresh_token'
    not_output: 'test-token'
  - name: report-does-not-quote-the-token-html
    reference: CS-RUN-011
    note: "v0.13.2: up to v0.13.1 a response that broke its schema was quoted in full, token included; the report still names the missing field"
    args: [conform, "{root}/clrsig/fixtures/token-endpoint-stricter.yaml", -b, "{fbase}", --format, html]
    exit: 1
    output: 'refresh_token'
    not_output: 'test-token'
  - name: report-does-not-quote-the-token-markdown
    reference: CS-RUN-011
    note: "v0.13.2: up to v0.13.1 a response that broke its schema was quoted in full, token included; the report still names the missing field"
    args: [conform, "{root}/clrsig/fixtures/token-endpoint-stricter.yaml", -b, "{fbase}", --format, markdown]
    exit: 1
    output: 'refresh\\?_token'   # Markdown writes the underscore escaped
    not_output: 'test-token'
  - name: run-report-does-not-quote-the-token
    reference: CS-RUN-011
    note: "v0.13.2: up to v0.13.1 a schema assertion kept the whole body as its actual value, also when it passed"
    args: [run, "{root}/clrsig/fixtures/token-report.yaml", --var, "baseUrl={fbase}", --format, json]
    exit: 1
    output: 'refresh_token'
    not_output: 'test-token'

  # ---- several problems in one 3.1 response, and baselines (clrsig 0.13.3) ----
  - name: two-problems-are-listed-one-each-in-order
    reference: CS-RUN-012
    note: "v0.13.3: each problem has its own line, in a fixed order; before, one line held both, in random order"
    args: [conform, "{root}/clrsig/fixtures/token-two-problems.yaml", -b, "{fbase}"]
    exit: 1
    output: "at '/expires_in'[\\s\\S]*at '/token_type'"   # the words before "at" differ between releases
    not_output: " \\| (error at |at ')"
  - name: a-second-problem-is-not-hidden-by-the-baseline
    reference: CS-RUN-012
    note: "v0.13.3: the baseline records one problem and the response has two. v0.13.2 usually passed this (B-131); the order was random"
    args: [conform, "{root}/clrsig/fixtures/token-two-problems.yaml", -b, "{fbase}", --baseline, "{root}/clrsig/fixtures/baseline-one-problem.yaml"]
    exit: 1
    output: 'Baseline: 1 known, 1 new, 0 fixed[\s\S]*NEW[^\n]*expires_in'
  - name: an-unchanged-response-with-two-problems-matches-its-baseline
    reference: CS-RUN-012
    note: "v0.13.3: v0.13.2 sometimes reported one of two recorded problems as new"
    args: [conform, "{root}/clrsig/fixtures/token-two-problems.yaml", -b, "{fbase}", --baseline, "{root}/clrsig/fixtures/baseline-two-problems.yaml"]
    exit: 0
    output: 'Baseline: 2 known, 0 new, 0 fixed'

  # ---- passwords written inside longer text (clrsig 0.13.3) ----
  - name: run-report-masks-written-out-passwords-text
    reference: CS-RUN-011
    note: "v0.13.3: only the password is masked; the scheme, user and host stay"
    args: [run, "{root}/clrsig/fixtures/password-report.yaml", --var, "baseUrl={fbase}"]
    exit: 1
    output: 'postgres://app:\*\*\*@db\.internal:5432/orders[\s\S]*Password=\*\*\*;'
    not_output: 'pw-canary'
  - name: run-report-masks-written-out-passwords-json
    reference: CS-RUN-011
    note: "v0.13.3: the same in a JSON report, scenario variables included"
    args: [run, "{root}/clrsig/fixtures/password-report.yaml", --var, "baseUrl={fbase}", --format, json]
    exit: 1
    output: 'redis://:\*\*\*@cache\.internal:6379'
    not_output: 'pw-canary'
