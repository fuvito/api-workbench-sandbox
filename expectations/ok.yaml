# Expected ClearSignal outcome for the `ok` API: it must conform exactly.
#
#   whole_spec   one plain `conform` run over every operation. Only the two operations in `failing`
#                may fail, and both are ClearSignal bugs, not fixture bugs:
#                  GET /preferences  F-008  a required cookie parameter is never sent
#                  GET /lookup       F-009  an explode=false array query parameter is sent as "[1 2 3]"
#                When those are fixed the entries must be removed (the run then expects exit 0).
#   scenarios    every step of the five ok scenarios must pass.
#   probes       `conform --negative` runs 44 probes and every one passes: the server rejects what it should.
#
# Run: uv run python scripts/check_expectations.py --expectations expectations/ok.yaml   (server on :8080)
#
# These expectations hold for clrsig v0.7.1 run through the spec copy that works around F-010
# (docs/clrsig-findings.md). Do not edit a spec or handler to change an expectation.

format: 1
family: ok
spec: specs/ok.yaml
prefix: /ok
env: clrsig/environments/ok.yaml

whole_spec:
  reset: true
  covers_all: true
  failing:
    - /preferences
    - /lookup

generation:
  operations: 65

