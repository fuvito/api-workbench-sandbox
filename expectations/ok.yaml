# Expected ClearSignal outcome for the `ok` API: it must conform exactly.
#
#   whole_spec   one plain `conform` run over every operation: all 65 must pass (exit 0).
#   scenarios    every step of the five ok scenarios must pass.
#   probes       `conform --negative` runs 62 probes and every one passes: the server rejects what it should.
#
# Run: uv run python scripts/check_expectations.py --expectations expectations/ok.yaml   (server on :8080)
#
# These expectations hold for clrsig v0.8.2 run against the standard spec (docs/clrsig-findings.md).
# Do not edit a spec or handler to change an expectation.

format: 1
family: ok
spec: specs/ok.yaml
prefix: /ok
env: clrsig/environments/ok.yaml

whole_spec:
  reset: true
  covers_all: true

generation:
  operations: 65

scenarios:
  - file: clrsig/scenarios/ok-crud.yaml
    env: clrsig/environments/ok.yaml
    steps:
      Reset ok store: { passed: true }
      List seeded products: { passed: true }
      Create product: { passed: true }
      Get product: { passed: true }
      Replace product: { passed: true }
      Reject product with wrong type: { passed: true }
      Create order for the new product: { passed: true }
      Reject order for unknown product: { passed: true }
      Reject order quantity above stock: { passed: true }
      Update order quantity (product has stock 3): { passed: true }
      Delete order: { passed: true }
      Deleted order is gone: { passed: true }
      Create project: { passed: true }
      Create task in project: { passed: true }
      Complete task: { passed: true }
      List tasks of project: { passed: true }
      Task is not visible under another project: { passed: true }
      Delete task: { passed: true }
      Delete project: { passed: true }
      Delete product: { passed: true }
      Deleted product is gone: { passed: true }
  - file: clrsig/scenarios/ok-business-rules.yaml
    env: clrsig/environments/ok.yaml
    steps:
      Reset ok store: { passed: true }
      Order above stock is refused: { passed: true }
      Create order (3 x 24.50 + 10% tax): { passed: true }
      Edit without If-Match is 428: { passed: true }
      Edit with a stale If-Match is 412: { passed: true }
      Edit with the current ETag: { passed: true }
      The old ETag no longer works (lost update prevented): { passed: true }
      Pay takes stock: { passed: true }
      Stock went from 5 to 3: { passed: true }
      Paying twice is 409: { passed: true }
      A paid order is no longer editable (409, precondition passes): { passed: true }
      Cancel a paid order gives stock back: { passed: true }
      Stock is back to 5: { passed: true }
      A cancelled order cannot ship: { passed: true }
      Create and pay another order: { passed: true }
      Invoice before payment is 409: { passed: true }
      Pay it: { passed: true }
      Invoice gets the next sequential number: { passed: true }
      One invoice per order: { passed: true }
      Duplicate email is a problem+json 409: { passed: true }
      Soft-delete a customer: { passed: true }
      A deleted customer is gone: { passed: true }
      includeDeleted still shows it: { passed: true }
      The email is free again: { passed: true }
      Project with open tasks cannot be deleted: { passed: true }
      cascade=true deletes it with its tasks: { passed: true }
      Its tasks are gone: { passed: true }
      First payment with a key: { passed: true }
      Same key and body replays the first payment: { passed: true }
      Same key with another body is 422: { passed: true }
      Valid code redeems: { passed: true }
      Expired code is 410: { passed: true }
      Start a report: { passed: true }
      Poll 1 - running: { passed: true }
      Poll 2 - running: { passed: true }
      Poll 3 - done: { passed: true }
      Rate limit call 1: { passed: true }
      Rate limit call 2: { passed: true }
      Rate limit call 3: { passed: true }
      Rate limit call 4: { passed: true }
      Rate limit call 5: { passed: true }
      Call 6 is throttled: { passed: true }
      Another client is not throttled: { passed: true }
  - file: clrsig/scenarios/ok-parameters-and-paging.yaml
    env: clrsig/environments/ok.yaml
    steps:
      Reset ok store: { passed: true }
      Page 1: { passed: true }
      Page 2 with the cursor from page 1: { passed: true }
      Page 3 is the last (two items): { passed: true }
      A malformed cursor is 400: { passed: true }
      Unread filter applies before paging: { passed: true }
      since is an RFC 3339 instant: { passed: true }
      Marking read is idempotent: { passed: true }
      Bulk create is atomic - one bad item rejects all: { passed: true }
      Bulk create: { passed: true }
      Products total is 5 (nothing from the rejected bulk was created): { passed: true }
      Bulk delete, partly missing, is 207: { passed: true }
      Bulk delete, all existing, is 200: { passed: true }
      X-Request-Id is echoed: { passed: true }
      X-Request-Id is generated when absent: { passed: true }
      A malformed X-Request-Id is 400: { passed: true }
      theme cookie: { passed: true }
      Missing theme cookie is 400: { passed: true }
      lookup parses every parameter type: { passed: true }
      A bracketed array is rejected: { passed: true }
      No token is 401: { passed: true }
      A valid token without the admin scope is 403: { passed: true }
      The admin token is 200: { passed: true }
      Cache-Control on a public read: { passed: true }
  - file: clrsig/scenarios/ok-schemas-and-security.yaml
    env: clrsig/environments/ok.yaml
    steps:
      Reset ok store: { passed: true }
      Bearer - valid token: { passed: true }
      Bearer - missing token: { passed: true }
      Bearer - wrong token: { passed: true }
      Basic - valid credentials: { passed: true }
      Basic - wrong password: { passed: true }
      API key in header - valid: { passed: true }
      API key in header - missing: { passed: true }
      API key in query - valid: { passed: true }
      API key in query - wrong: { passed: true }
      Create card payment: { passed: true }
      Create bank payment with a UUID reference: { passed: true }
      Get the card payment: { passed: true }
      Reject unknown payment method: { passed: true }
      Reject card payment carrying bank fields: { passed: true }
      Reject reference that is neither UUID nor positive integer: { passed: true }
      Create customer with nullable birthDate: { passed: true }
      Invalid email is a problem+json 400: { passed: true }
      Unknown customer is a problem+json 404: { passed: true }
      Replace settings map: { passed: true }
      Version is text/plain: { passed: true }
  - file: clrsig/scenarios/ok-latency.yaml
    env: clrsig/environments/ok.yaml
    steps:
      Reset ok store: { passed: true }
      Fast control - no delay: { passed: true }
      Slow but correct - 400 ms: { passed: true }
      List with an optional delay: { passed: true }
      Delay above the cap is rejected: { passed: true }
      Negative delay is rejected: { passed: true }

probes:
  - { op: '/audit-events', probes: 1, fail: [] }
  - { op: '/customers', probes: 4, fail: [] }
  - { op: '/feature-flags', probes: 1, fail: [] }
  - { op: '/lookup', probes: 1, fail: [] }
  - { op: '/me', probes: 1, fail: [] }
  - { op: '/orders', probes: 4, fail: [] }
  - { op: '/orders/{orderId}', probes: 6, fail: [] }
  - { op: /payments, probes: 16, fail: [], why: "both oneOf branches are probed (missing field, wrong type); the server rejects every one" }
  - { op: '/partner-status', probes: 1, fail: [] }
  - { op: '/products', probes: 6, fail: [] }
  - { op: '/products/bulk', probes: 2, fail: [] }
  - { op: '/products/bulk-delete', probes: 2, fail: [] }
  - { op: '/products/{productId}', probes: 6, fail: [] }
  - { op: '/projects', probes: 2, fail: [] }
  - { op: '/projects/{projectId}', probes: 2, fail: [] }
  - { op: '/projects/{projectId}/tasks', probes: 2, fail: [] }
  - { op: '/projects/{projectId}/tasks/{taskId}', probes: 2, fail: [] }
  - { op: '/reports', probes: 2, fail: [] }
  - { op: '/stats', probes: 1, fail: [] }

# clrsig commands and flags the fixtures exercise beyond the check catalog (docs/commands-and-flags.md).
# Each entry is one command with its exit code and a regex over what it prints; `not_output` must NOT match.
# Everything here is pinned for the clrsig release in CI: when a flag changes, the entry flips.
runs:
  # ---- conform: choosing what is sent ----
  - name: conform-read-only
    reference: CS-NC-007
    note: "--read-only sends GET and HEAD only; every other operation is skipped and never sent"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --read-only]
    exit: 0
    output: 'PASSED\s+65 operations\s+·\s+33 passed\s+·\s+0 failed\s+·\s+32 skipped'
  - name: conform-tags
    reference: null
    note: "--tags products runs the operations tagged products only"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --tags, products]
    exit: 0
    output: 'PASSED\s+65 operations\s+·\s+12 passed\s+·\s+0 failed\s+·\s+53 skipped'
  - name: conform-tags-matches-nothing
    reference: null
    note: "v0.8.9: a filter that selects nothing is an error: NOTHING CHECKED, exit 2 (it was PASSED, exit 0)"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --tags, nosuchtag]
    exit: 2
    output: 'NOTHING CHECKED[\s\S]*no operation matches --tags nosuchtag'
  - name: conform-paths-matches-nothing
    reference: null
    note: "v0.8.9: the same for --paths (a mistyped prefix); the exit code is 2"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --paths, /nosuch]
    exit: 2
    output: 'NOTHING CHECKED[\s\S]*no operation matches --paths /nosuch'
  - name: conform-read-only-checks-nothing
    reference: null
    note: "v0.8.9: every operation skipped by --read-only (only a POST in the spec): the headline says NOTHING CHECKED, the exit code stays 0"
    args: [conform, "{root}/specs/hostile/only-post.yaml", -b, "{fbase}", --read-only]
    exit: 0
    output: 'NOTHING CHECKED\s+1 operations'
  - name: conform-explain
    reference: CS-RESP-001
    note: "--explain adds the catalog ID and a plain-language reason under each failure"
    args: [conform, "{root}/specs/contract-fail.yaml", -b, "{base}/contract-fail", --paths, "/cases/resp-001", --explain]
    exit: 1
    output: '\[CS-RESP-001\] Status 500 is not declared for GET /cases/resp-001-undeclared-status'
  - name: conform-format-github
    reference: CS-RESP-005
    note: "v0.10.0: --format github prints a workflow annotation on the spec line of the failed operation, with the check ID"
    args: [conform, "{root}/specs/contract-fail.yaml", -b, "{base}/contract-fail", --paths, "/cases/resp-005", --format, github]
    exit: 1
    output: '::error file=[^,]*contract-fail\.yaml,line=\d+,title=CS-RESP-005 GET /cases/resp-005-missing-required-field::'
  - name: conform-fail-on-invalid
    reference: null
    note: "v0.9.0: --fail-on takes failure or warning; anything else is a usage error, exit 2"
    args: [conform, "{root}/specs/contract-fail.yaml", -b, "{base}/contract-fail", --paths, "/cases/resp-005", --fail-on, bogus]
    exit: 2
    output: 'use failure \(the default\) or warning'
  - name: validate-spec-lint
    reference: null
    note: "v0.11.0: validate --spec lints the OpenAPI document itself; the ok spec is clean"
    args: [validate, --spec, "{root}/specs/ok.yaml"]
    exit: 0
    output: 'OK'
  - name: validate-strict-scenario
    reference: null
    note: "v0.9.1: validate --strict lints a scenario for problems the plain validation allows; the CRUD scenario is clean"
    args: [validate, --strict, "{root}/clrsig/scenarios/ok-crud.yaml"]
    exit: 0
    output: 'OK'
  - name: run-format-github
    reference: null
    note: "v0.11.0: run --format github prints a summary notice (and an annotation per failed step)"
    args: [run, "{root}/clrsig/scenarios/ok-crud.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --format, github]
    exit: 0
    output: '::notice title=Clear Signal run::1 scenarios: 1 passed, 0 failed'
  - name: conform-fail-fast
    reference: null
    note: "--fail-fast stops at the first violation (contract-fail: 27 of 37 fail without it)"
    args: [conform, "{root}/specs/contract-fail.yaml", -b, "{base}/contract-fail", --fail-fast]
    exit: 1
    output: 'FAILED\s+8 operations\s+·\s+7 passed\s+·\s+1 failed\s+·\s+0 skipped'

  # ---- the spec itself (clrsig 0.11.0, catalog 2.5) ----
  - name: validate-spec-required-not-declared
    reference: CS-SPEC-002
    note: "a required property that is not declared is an error: exit 1"
    args: [validate, --spec, "{root}/specs/lint/required-undeclared.yaml"]
    exit: 1
    output: '\[CS-SPEC-002\] GET /things response 200 lists "email" as required'
  - name: validate-spec-missing-operation-id
    reference: CS-SPEC-001
    note: "a missing operationId is a warning, shown as a note: exit 0"
    args: [validate, --spec, "{root}/specs/lint/missing-operation-id.yaml"]
    exit: 0
    output: 'OK\s+note: \[CS-SPEC-001\] GET /things has no operationId'
  - name: validate-spec-example-breaks-its-format
    reference: CS-SPEC-003
    note: "an example that breaks its format is a warning too: the spec still loads, exit 0"
    args: [validate, --spec, "{root}/specs/lint/example-breaks-format.yaml"]
    exit: 0
    output: 'OK\s+note: \[CS-SPEC-003\]'
  - name: validate-spec-strict-fails-on-a-warning
    reference: CS-SPEC-001
    note: "--strict makes a spec warning fail the check"
    args: [validate, --spec, "{root}/specs/lint/missing-operation-id.yaml", --strict]
    exit: 1
    output: 'CS-SPEC-001'
  - name: validate-strict-reports-an-unused-extraction
    reference: null
    note: "v0.9.1: --strict fails a valid scenario whose extraction no later step uses"
    args: [validate, --strict, "{root}/clrsig/scenarios/conform-fail-failed-extraction.yaml"]
    exit: 1
    output: 'warning: \[step 1\] extract nothing: extracts "nope", but no later step uses \{\{nope\}\}'

  # ---- project file, setup scenario, changed operations, baseline guard (clrsig 0.9.1, 0.10.0) ----
  - name: config-show-reads-the-project-file
    reference: null
    note: "v0.9.1: config show says which values come from clrsig.yaml and which are defaults"
    args: [config, show, --config, "{root}/clrsig/fixtures/project/clrsig.yaml"]
    exit: 0
    output: 'conform\.readOnly\s+true\s+file[\s\S]*conform\.negative\s+false\s+default'
  - name: conform-from-the-project-file
    reference: null
    note: "v0.9.1: conform with no spec or flags takes spec, environment, base URL and readOnly from the project file"
    args: [conform, --config, "{root}/clrsig/fixtures/project/clrsig.yaml"]
    exit: 0
    output: 'PASSED\s+65 operations\s+·\s+33 passed\s+·\s+0 failed\s+·\s+32 skipped'
  - name: init-dry-run-writes-nothing
    reference: null
    note: "v0.9.1: init --dry-run lists what it would create"
    args: [init, "{root}/.pytest_cache/clrsig-init", --dry-run]
    exit: 0
    output: 'nothing was written[\s\S]*clrsig\.yaml'
  # ---- what a run needs, and empty values (clrsig 0.13.0) ----
  - name: conform-list-sends-nothing
    reference: null
    note: "v0.13.0: --list needs no server (the port is closed) and names what is missing; exit 0"
    args: [conform, "{spec}", -b, "http://localhost:1", --list]
    exit: 0
    output: 'Nothing was sent\.[\s\S]*65 operations\s+·\s+25 ready\s+·\s+40 would not be sent\s+·\s+0 skipped[\s\S]*Missing: '
  - name: conform-list-refuses-negative
    reference: null
    note: "v0.13.0: a flag that only matters when requests are sent is a usage error"
    args: [conform, "{spec}", -b, "http://localhost:1", --list, --negative]
    exit: 2
    output: '--list sends nothing, so it cannot be used with --negative'
  - name: init-lists-the-values-the-spec-needs
    reference: null
    note: "v0.13.0: init --spec reads which values the spec's requests take"
    args: [init, "{root}/.pytest_cache/clrsig-init-spec", --spec, "{spec}", --dry-run]
    exit: 0
    output: 'nothing was written[\s\S]*The spec needs: .*productId[\s\S]*would be listed'
  - name: conform-an-empty-path-value-is-not-sent
    reference: CS-RUN-001
    note: "v0.13.0: before, /products/{{productId}} with an empty value was sent as /products/ and could pass"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --paths, /products/, --read-only, --var, "productId="]
    exit: 1
    output: 'not sent: no value for \{\{productId\}\} \(defined but empty'
  - name: conform-an-empty-token-is-not-sent
    reference: CS-RUN-001
    note: "v0.13.0: an empty bearer token"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --paths, /me, --var, "token="]
    exit: 1
    output: 'defined but empty: \{\{token\}\}[\s\S]*0 passed\s+·\s+0 failed\s+·\s+1 not sent'
  - name: conform-an-empty-api-key-is-not-sent
    reference: CS-RUN-001
    note: "v0.13.0: an empty API key"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --paths, /feature-flags, --var, "apiKey="]
    exit: 1
    output: 'defined but empty: \{\{apiKey\}\}[\s\S]*0 passed\s+·\s+0 failed\s+·\s+1 not sent'
  - name: conform-an-empty-basic-user-name-is-not-sent
    reference: CS-RUN-001
    note: "v0.13.0: an empty basic user name"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --paths, /audit-events, --var, "basicUser="]
    exit: 1
    output: 'defined but empty: \{\{basicUser\}\}[\s\S]*0 passed\s+·\s+0 failed\s+·\s+1 not sent'
  - name: conform-an-empty-basic-password-is-sent
    reference: CS-GAP-013
    note: "a known gap, pinned: the password is sent empty, the server refuses the login with a declared 401, and the operation PASSES"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/ok.yaml", --paths, /audit-events, --var, "basicPass="]
    exit: 0
    output: 'PASS\s+GET\s+/audit-events\s+401'
    not_output: 'not sent'
  - name: conform-without-the-setup-is-not-sent
    reference: CS-RUN-001
    note: "control for the next entry: the environment has no {{token}}"
    args: [conform, "{root}/specs/ok-features.yaml", -b, "{base}/ok", --env, "{root}/clrsig/environments/ok-features-no-token.yaml", --paths, /features/oauth2-profile]
    exit: 1
    output: 'not sent: no value for \{\{token\}\}'
  - name: conform-setup-supplies-the-token
    reference: null
    note: "v0.9.1: --setup runs the login scenario first; what it extracts fills the generated request"
    args: [conform, "{root}/specs/ok-features.yaml", -b, "{base}/ok", --env, "{root}/clrsig/environments/ok-features-no-token.yaml", --paths, /features/oauth2-profile, --setup, "{root}/clrsig/scenarios/ok-setup-login.yaml"]
    exit: 0
    output: 'PASSED\s+26 operations\s+·\s+1 passed[\s\S]*values available to the check: token'   # stdout, then stderr
  - name: conform-failed-setup-does-not-start-the-check
    reference: null
    note: "v0.9.1: a setup scenario that fails stops the run before any operation, exit 2"
    args: [conform, "{root}/specs/ok-features.yaml", -b, "{base}/ok", --env, "{root}/clrsig/environments/conform-fail.yaml", --setup, "{root}/clrsig/scenarios/conform-fail-failed-extraction.yaml"]
    exit: 2
    output: 'did not pass, so the check was not started'
    not_output: 'operations\s+·'
  - name: conform-changed-against-head-checks-nothing
    reference: CS-NC-007
    note: "v0.10.0: nothing changed against HEAD, so nothing is sent and the run passes (the spec is one nobody edits)"
    args: [conform, "{root}/specs/hostile/only-post.yaml", -b, "{fbase}", --changed-against, HEAD]
    exit: 0
    output: 'NOTHING CHECKED[\s\S]*no operation changed against HEAD'
  - name: conform-changed-against-unknown-ref
    reference: null
    note: "v0.10.0: a git ref that does not exist is a configuration error"
    args: [conform, "{root}/specs/hostile/only-post.yaml", -b, "{fbase}", --changed-against, no-such-ref]
    exit: 2
    output: 'git ref "no-such-ref" was not found'
  - name: write-baseline-is-refused-for-a-limited-run
    reference: null
    note: "v0.10.0: a baseline written from a filtered run would drop the other entries"
    args: [conform, "{root}/specs/contract-fail.yaml", -b, "{base}/contract-fail", --paths, "/cases/resp-005", --write-baseline, "{root}/.pytest_cache/clrsig-refused-baseline.yaml"]
    exit: 2
    output: 'record the baseline with a full run'

  # ---- run: seeds, variables, reports ----
  - name: run-seed-7
    reference: null
    note: "the same --seed gives the same random value: {{$randomInt 1 40}} is 33 with seed 7 ..."
    args: [run, "{root}/clrsig/scenarios/ok-dynamic-values.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "7", --format, json]
    exit: 0
    output: '"seed": 7[\s\S]*"value": "33"'
  - name: run-seed-7-relative-path
    reference: null
    note: "... however the path is written: since v0.8.4 the values come from the seed and the scenario title (F-024)"
    args: [run, "clrsig/scenarios/ok-dynamic-values.yaml", --env, "clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "7", --format, json]
    exit: 0
    output: '"seed": 7[\s\S]*"value": "33"'
  - name: run-seed-8
    reference: null
    note: "... and 12 with seed 8"
    args: [run, "{root}/clrsig/scenarios/ok-dynamic-values.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "8", --format, json]
    exit: 0
    output: '"seed": 8[\s\S]*"value": "12"'
  - name: run-var-overrides-the-environment
    reference: CS-RUN-003
    note: "--var baseUrl=... replaces the environment value for this run: a closed port gives no response"
    args: [run, "{root}/clrsig/scenarios/ok-dynamic-values.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "7", --var, "baseUrl=http://localhost:1"]
    exit: 1
    output: 'executing request.*localhost:1/ok-slow/\d+'
  - name: run-timeout-flag
    reference: CS-RUN-003
    note: "--timeout 100 overrides every step timeout: the slow steps get no response"
    args: [run, "{root}/clrsig/scenarios/ok-latency.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --timeout, "100"]
    exit: 1
    output: 'context deadline exceeded'
  - name: run-coverage
    reference: null
    note: "--coverage appends the operations the scenario exercised"
    args: [run, "{root}/clrsig/scenarios/ok-crud.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --coverage]
    exit: 0
    output: 'Spec coverage: 16 / 65 operations \(25%\)'
  - name: run-format-markdown
    reference: null
    args: [run, "{root}/clrsig/scenarios/ok-dynamic-values.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "7", --format, markdown]
    exit: 0
    output: '✅ \*\*PASSED\*\* — 1 passed'
  - name: run-format-html
    reference: null
    args: [run, "{root}/clrsig/scenarios/ok-dynamic-values.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "7", --format, html]
    exit: 0
    output: '<!DOCTYPE html>[\s\S]*ok - dynamic values and variables'
  - name: run-format-junit
    reference: null
    args: [run, "{root}/clrsig/scenarios/ok-dynamic-values.yaml", --env, "{root}/clrsig/environments/ok.yaml", --spec, "{spec}", --seed, "7", --format, junit]
    exit: 0
    output: '<testsuites name="ok - dynamic values and variables" tests="1" failures="0"'
