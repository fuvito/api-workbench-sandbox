# Expected ClearSignal outcome for the conform-fail cases.
#
# Same conventions as expectations/contract-fail.yaml (read its header). Sections in this file:
#   probes   `clrsig conform --negative`: each operation's negative probes. The runner runs
#            `--negative` once for the whole spec and reads the text report; probes carry no check
#            ID, so `probe_kinds` maps the start of each description to its CS-PROBE ID.
#            `probes` is how many probes ClearSignal generates for the operation: when that
#            changes (for example the day it probes enums or unknown fields, CS-GAP-009) the case
#            must be reviewed. `fail` lists the probe descriptions that must FAIL, with their ID.
#
# Run: uv run python scripts/check_expectations.py --expectations expectations/conform-fail.yaml
#
# Holds for clrsig v0.8.2 against the standard spec. Do not edit a spec or handler to change
# an expectation.

format: 1
family: conform-fail
spec: specs/conform-fail.yaml
prefix: /conform-fail
env: clrsig/environments/conform-fail.yaml
ignore: [/health]

# Probe kinds as ClearSignal words them in the text report (catalog 2.2).
probe_kinds:
  "missing required field": CS-PROBE-001
  "wrong type for field": CS-PROBE-002
  "missing required query param": CS-PROBE-003
  "missing required header": CS-PROBE-003
  "no credentials": CS-PROBE-004

# ---- spec and server disagree about what exists (slice 2) ----
# Plain `conform` on each operation. A declared route the server does not serve answers 404/405/400,
# which the spec does not declare: CS-RESP-001 every time (the notes' "and a conformance failure").
cases:
  - { case: ghost, path: /ghost, expect: fail, check: CS-RESP-001, message: 'answered 404, but the spec declares only 200' }
  - { case: orphan, path: /orphan, expect: fail, check: CS-RESP-001, message: 'answered 405, but the spec declares only 204' }
  - { case: wrong-method, path: /wrong-method, expect: fail, check: CS-RESP-001, message: 'answered 405, but the spec declares only 200' }
  - { case: path-param-type, path: '/path-param/{id}', expect: fail, check: CS-RESP-001, message: 'answered 400, but the spec declares only 200' }
  - { case: requires-extra-header, path: /requires-extra-header, expect: fail, check: CS-RESP-001, message: 'answered 400, but the spec declares only 201' }
  # CS-REQ-003: ClearSignal builds form and multipart bodies from the spec (CS-GAP-006 is closed, F-015),
  # so both operations pass as the correct server and spec they are.
  - { case: form-body, path: /form, expect: pass, reference: CS-REQ-003, why: "the form fields are generated from the schema" }
  - { case: multipart-body, path: /multipart, expect: pass, reference: CS-REQ-003, why: "the multipart parts are generated from the schema" }
  # CS-GAP-010: the callback is not under paths and is never exercised; the operation that declares it passes.
  - { case: subscribe-with-callback, path: /subscribe, expect: pass, reference: CS-GAP-010, why: "the callback is not exercised and the server never contacts it" }

  # ---- slice 3 controls: the same operations pass with the right environment ----
  - { case: requests-param-type-ok, path: '/requests/param-type/{itemId}', expect: pass, reference: null, why: "itemId=7 from the right environment: a valid request, a correct response" }
  - { case: requests-body-value-ok, path: /requests/body-value, expect: pass, reference: null, why: "amount=19.99 from the right environment" }

  # ---- slice 4: timing and instability ----
  # Slowness is asserted with `--max-response-time` (CS-RESP-014, clrsig v0.8.2): the response
  # arrives and is still compared, and the finding is `slow-response`. A case "outlasts" a timeout
  # when `args` sets a short `--request-timeout` instead: no response at all (CS-RUN-003).
  # `local_only` marks transport behavior not verified on Cloud Run (run with --cloud to skip).
  - { case: slow, path: /slow, args: ['--request-timeout', 1500], expect: fail, check: CS-RUN-003, message: 'context deadline exceeded', note: "15 s against a 1.5 s timeout" }
  - { case: latency-within-timeout, path: '/latency/{ms}', expect: pass, reference: null, why: "200 ms answered correctly, and within the default timeout (no response-time limit given)" }
  - { case: latency-within-limit, path: '/latency/{ms}', args: ['--max-response-time', 1000], expect: pass, reference: CS-RESP-014, why: "200 ms against a 1000 ms limit" }
  - { case: latency-over-limit, path: '/latency/{ms}', args: ['--max-response-time', 50], expect: fail, check: CS-RESP-014, message: 'slower than the 50 ms limit', note: "200 ms against a 50 ms limit (150 ms margin); the response is still compared with the spec" }
  - { case: unavailable, path: /unavailable, expect: fail, check: CS-RESP-001, message: 'answered 503, but the spec declares only 200' }
  - { case: redirect-loop, path: /redirect-loop, expect: fail, check: CS-RUN-003, message: 'stopped after 10 redirects' }
  - { case: hang, path: /timeout/hang, args: ['--request-timeout', 1500], local_only: true, expect: fail, check: CS-RUN-003, message: 'context deadline exceeded' }
  - { case: slow-headers-outlasts-timeout, path: /timeout/slow-headers, args: ['--request-timeout', 1500], local_only: true, expect: fail, check: CS-RUN-003, message: 'executing request.*context deadline exceeded' }
  - { case: slow-headers-within-timeout, path: /timeout/slow-headers, local_only: true, expect: pass, reference: null, why: "4 s against the default 10 s timeout, no response-time limit" }
  - { case: slow-headers-over-limit, path: /timeout/slow-headers, args: ['--max-response-time', 2000], local_only: true, expect: fail, check: CS-RESP-014, message: 'slower than the 2000 ms limit', note: "4 s against a 2 s limit: the response arrives and conforms, but is too slow" }
  - { case: slow-body, path: /timeout/slow-body, args: ['--request-timeout', 3000], local_only: true, expect: fail, check: CS-RUN-003, message: 'reading response body: context deadline exceeded', note: "headers arrive at once; the timeout hits while reading the body" }
  - { case: truncated-body, path: /timeout/truncated-body, local_only: true, expect: fail, check: CS-RUN-003, message: 'reading response body: unexpected EOF', note: "the notes said CS-RUN-003 or CS-RESP-008: it is CS-RUN-003 (no response)" }
  - { case: connection-reset, path: /timeout/connection-reset, local_only: true, expect: fail, check: CS-RUN-003, message: 'EOF' }
  - { case: large-1mb, path: /large, expect: pass, reference: CS-NC-003, why: "a binary body is not compared" }
  - { case: large-json-1mb, path: /large/json, expect: pass, reference: null, why: "a valid 1 MB JSON body" }
  - { case: after-write-outlasts-timeout, path: /timeout/after-write, args: ['--request-timeout', 1500], local_only: true, expect: fail, check: CS-RUN-003, message: 'context deadline exceeded', note: "the write still took effect, see the scenario" }
  - { case: after-write-records, path: /timeout/after-write/records, expect: pass, reference: null, why: "the records written so far" }
  - { case: idempotent-create, path: /idempotent, expect: pass, reference: null, why: "a single request cannot show the missing idempotency; see the scenario" }
  - { case: idempotent-records, path: /idempotent/records, expect: pass, reference: null, why: "the records created so far" }
  - { case: lost-update, path: /lost-update, operations: 2, expect: pass, reference: null, why: "GET and PUT each conform; the lost update shows only in a scenario" }
  - { case: drift-report-at-drift-0, path: /drift/report, expect: pass, reference: null, why: "the default drift level: total is an integer; at drift 1 it becomes a string (see the drift section)" }
  # ---- slice 5: business rules the server breaks (the contract checks cannot see them) ----
  - { case: rules-stock, path: /rules/stock, expect: pass, reference: null, why: "a correct response; the rule is broken elsewhere" }
  - { case: rules-create-order, path: /rules/orders, expect: pass, reference: null, why: "quantity 1 is within the stock; the response matches the spec" }
  - { case: rules-ship-order, path: '/rules/orders/{orderId}/ship', expect: pass, reference: null, why: "200 or the declared 409, whichever state o-1 is in" }
  - { case: rules-cancel-order, path: '/rules/orders/{orderId}/cancel', expect: pass, reference: null, why: "200 (also for a shipped order, the broken rule) or the declared 409" }
  - { case: rules-create-customer, path: /rules/customers, expect: pass, reference: null, why: "the first customer; the duplicate is only visible in a scenario" }
  - { case: rules-items, path: /rules/items, expect: pass, reference: null, why: "a valid page; the repeat only shows across two pages" }
  - { case: rules-protected-token-not-known, path: /rules/protected, expect: pass, reference: null, why: "ClearSignal's test-token is unknown here: the declared 401" }
  - { case: rules-withdraw-insufficient-funds, path: /rules/withdrawals, expect: fail, check: CS-RESP-005, message: 'property "id" is missing', note: "500 is above the balance: the declared 422 is answered 200 with an error body; the notes: CS-RESP-001 if 200 is declared with another shape, else a scenario assertion" }

  # ---- slice 6: the adversarial group, bodies and HTTP shapes a real server can produce ----
  # Valid and valid for the schema, only unusual: ClearSignal must accept all of them.
  - { case: hostile-deep-nesting, path: /hostile/deep-nesting, expect: pass, reference: null, why: "JSON nested 200 levels deep" }
  - { case: hostile-wide-object, path: /hostile/wide-object, expect: pass, reference: null, why: "an object with 20000 keys" }
  - { case: hostile-unicode, path: /hostile/unicode, expect: pass, reference: null, why: "accents, Hebrew, an emoji, an escaped surrogate pair and an escaped NUL" }
  - { case: hostile-integer-as-float, path: /hostile/integer-as-float, expect: pass, reference: null, why: "id is 1.0: an integer in JSON Schema" }
  - { case: hostile-integer-exponent, path: /hostile/integer-exponent, expect: pass, reference: null, why: "id is 1e2: an integer in JSON Schema" }
  - { case: hostile-big-integer, path: /hostile/big-integer, expect: pass, reference: null, why: "id is one above int64: still an integer for an unbounded schema" }
  - { case: hostile-negative-zero, path: /hostile/negative-zero, expect: pass, reference: null, why: "id is -0" }
  - { case: hostile-gzip, path: /hostile/gzip, expect: pass, reference: null, why: "a valid gzip body with Content-Encoding gzip is decoded" }
  - { case: hostile-duplicate-headers, path: /hostile/duplicate-headers, expect: pass, reference: null, why: "the same header twice and two Set-Cookie headers" }
  - { case: hostile-big-header, path: /hostile/big-header, expect: pass, reference: null, why: "a 60000-byte response header" }
  - { case: hostile-chunked-stream, path: /hostile/chunked-stream, expect: pass, reference: null, why: "no Content-Length: three chunks" }
  - { case: hostile-lone-surrogate, path: /hostile/lone-surrogate, expect: pass, reference: null, why: "an unpaired surrogate escape is valid JSON text; ClearSignal does not check that it is valid Unicode (undefined by the standard)" }
  # Malformed bodies (v0.8.5 rejects the two it used to accept, F-026 and F-027), and outcomes the standard leaves undefined.
  - { case: hostile-invalid-utf8, path: /hostile/invalid-utf8, expect: fail, check: CS-RESP-008, message: 'not valid JSON \(byte 0xff at offset 20 is not UTF-8\)', note: "bytes ff fe are not UTF-8 (F-026, fixed in v0.8.5)" }
  - { case: hostile-trailing-garbage, path: /hostile/trailing-garbage, expect: fail, check: CS-RESP-008, message: 'not valid JSON \(text after the JSON value\)', note: "text after the JSON value (F-027, fixed in v0.8.5)" }
  - { case: hostile-raw-newline-in-string, path: /hostile/raw-newline-in-string, expect: fail, check: CS-RESP-008, message: 'not valid JSON \(invalid character .\\n. in string literal' }
  - { case: hostile-nan-literal, path: /hostile/nan-literal, expect: fail, check: CS-RESP-008, message: 'not valid JSON \(invalid character ''N''' }
  - { case: hostile-bom, path: /hostile/bom, expect: fail, check: CS-RESP-008, message: 'not valid JSON \(invalid character', note: "RFC 8259 lets a parser ignore a BOM; ClearSignal rejects it (strict, defensible)" }
  - { case: hostile-duplicate-keys, path: /hostile/duplicate-keys, expect: fail, check: CS-RESP-006, message: 'value must be an integer', note: "the last duplicate wins (id is the string two); the standard leaves this undefined" }
  - { case: hostile-gzip-lie, path: /hostile/gzip-lie, expect: fail, check: CS-RUN-003, message: 'reading response body: unexpected EOF', note: "Content-Encoding gzip on a plain body: no readable response" }
  - { case: hostile-float-overflow, path: /hostile/float-overflow, expect: fail, check: CS-RESP-015, kind: number-out-of-range, message: 'ParseFloat: parsing "1e400": value out of range', note: "a valid JSON number beyond float64 has its own finding since v0.8.5 (F-028)" }

# State-dependent behavior: reset, then call the operation several times and compare call by call.
# Every counter lives in the store, so the same reset always gives the same sequence.
sequences:
  - { name: flaky-every-third-call, path: /flaky, outcomes: [pass, pass, fail, pass, pass, fail], check: CS-RESP-001, fail: { kind: undeclared-status, message: 'answered 500, but the spec declares only 200' } }
  - { name: rate-limited-after-three-calls, path: /rate-limited, outcomes: [pass, pass, pass, fail, fail, fail], check: CS-RESP-001, fail: { kind: undeclared-status, message: 'answered 429, but the spec declares only 200' } }
  - { name: unavailable-then-ok, path: /unavailable-then-ok, outcomes: [fail, fail, pass, pass], check: CS-RESP-001, fail: { kind: undeclared-status, message: 'answered 503, but the spec declares only 200' } }
  # Delays 100, 400, 700, 1000, 1300 ms against an 850 ms limit (150 ms margins).
  - { name: degrading-latency, path: /latency/degrading, args: ['--max-response-time', 850], outcomes: [pass, pass, pass, fail, fail], check: CS-RESP-014, fail: { kind: slow-response, message: 'slower than the 850 ms limit' } }
  # Seeded delays 160, 906, 477, 477, 507, 264 ms against a 700 ms limit (at least 190 ms margins),
  # and the same sequence again after another reset: jitter that repeats.
  - { name: seeded-jitter-repeats, path: /latency/jitter, args: ['--max-response-time', 700], repeat: 2, outcomes: [pass, fail, pass, pass, pass, pass], check: CS-RESP-014, fail: { kind: slow-response, message: 'slower than the 700 ms limit' } }

# The whole spec in one run, after a reset and with a 3 s request timeout, so the slow cases time out
# and the counters are all at their first call. Only the paths listed here may fail.
whole_spec:
  reset: true
  request_timeout: 3000
  failing:
    - /ghost
    - /orphan
    - /wrong-method
    - '/path-param/{id}'
    - /requires-extra-header
    - /slow
    - /unavailable
    - /unavailable-then-ok
    - /redirect-loop
    - /timeout/hang
    - /timeout/slow-headers
    - /timeout/slow-body
    - /timeout/truncated-body
    - /timeout/connection-reset
    - /timeout/after-write
    - /rules/withdrawals
    - /hostile/raw-newline-in-string
    - /hostile/nan-literal
    - /hostile/bom
    - /hostile/duplicate-keys
    - /hostile/gzip-lie
    - /hostile/invalid-utf8
    - /hostile/trailing-garbage
    - /hostile/float-overflow

# ---- requests that do not fit, and runs that cannot happen (slice 3) ----
# Whole commands: the wrong environment files are next to the right one in clrsig/environments/.
# `finding.kind` is clrsig's JSON kind; `output` is a regex over everything the command printed.
runs:
  # CS-REQ-001 / CS-REQ-002: a value from the environment does not fit the declared type.
  - name: req-001-wrong-parameter-type
    check: CS-REQ-001
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-bad-values.yaml", --paths, "/requests/param-type", --format, json]
    exit: 1
    finding: { kind: request, message: 'path parameter "itemId" does not fit the spec: value abc' }
  - name: req-002-wrong-body-value
    check: CS-REQ-002
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-bad-values.yaml", --paths, "/requests/body-value", --format, json]
    exit: 1
    finding: { kind: request, message: 'request body field "amount" takes its value from \{\{amount\}\}, which is "cheap"' }

  # CS-RUN-001 / CS-RUN-002: the request is not sent. Both share the finding kind `missing-value`.
  - name: run-001-missing-placeholder
    check: CS-RUN-001
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-missing-value.yaml", --paths, "/requests/param-type", --format, json]
    exit: 1
    finding: { kind: missing-value, message: 'not sent: no value for \{\{itemId\}\}' }
  - name: run-002-bad-dynamic-function-in-environment
    check: CS-RUN-002
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-bad-function.yaml", --paths, "/requests/param-type", --format, json]
    exit: 1
    finding: { kind: dynamic-value-failed, check: CS-RUN-002, message: 'unknown function \$noSuchFunction' }
  - name: run-002b-bad-dynamic-function-in-scenario
    check: CS-RUN-007
    note: "since v0.8.3 only that step fails (not sent) and the good step still runs; exit 1 (F-016)"
    args: [run, "{root}/clrsig/scenarios/conform-fail-bad-function.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 1
    output: '(?s)unknown function \$noSuchFunction.*PASS\s+good step'

  # CS-RUN-003: no response.
  - name: run-003-server-down-wrong-base-url
    check: CS-RUN-003
    args: [conform, "{spec}", -b, "http://localhost:1", --paths, "/health", --format, json]
    exit: 1
    finding: { kind: no-response, message: 'executing request' }

  # CS-RUN-004: the spec cannot be read (exit code 2, an error rather than a failure).
  - name: run-004a-unreadable-yaml
    check: CS-RUN-004
    args: [conform, "{root}/clrsig/fixtures/unreadable-yaml.yaml", -b, "{base}"]
    exit: 2
    output: 'parsing spec: loading spec: failed to unmarshal data'
  - name: run-004b-not-an-openapi-document
    check: CS-RUN-004
    args: [conform, "{root}/clrsig/fixtures/not-openapi.yaml", -b, "{base}"]
    exit: 2
    output: 'invalid OpenAPI spec: value of openapi must be a non-empty string'
  - name: run-004c-spec-file-missing
    check: CS-RUN-004
    args: [conform, "{root}/clrsig/fixtures/does-not-exist.yaml", -b, "{base}"]
    exit: 2
    output: 'reading spec: open '
  - name: run-004d-spec-url-returns-404
    check: CS-RUN-004
    args: [conform, "{base}/conform-fail/nope.yaml"]
    exit: 2
    output: 'server returned 404'

  # ---- slice 4: the default timeout, a fixed latency on both sides of the timeout, and the 50 MB cap ----
  - name: slow-outlasts-the-default-timeout
    check: CS-RUN-003
    note: "takes about 10 s: the default request timeout"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail.yaml", --paths, "/slow", --format, json]
    exit: 1
    finding: { kind: no-response, message: 'context deadline exceeded' }
  - name: latency-3s-with-a-1s-timeout
    op: '/latency/{ms}'
    check: CS-RUN-003
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-latency-3s.yaml", --paths, "/latency/", --request-timeout, "1000", --format, json]
    exit: 1
    finding: { kind: no-response, message: 'context deadline exceeded' }
  - name: latency-3s-with-a-6s-timeout
    op: '/latency/{ms}'
    reference: CS-GAP-005
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-latency-3s.yaml", --paths, "/latency/", --request-timeout, "6000", --format, json]
    exit: 0
    passed: true
  # The client reads at most 50 MB; a larger body is reported as CS-RESP-013 (a binary one is still not compared).
  - name: large-binary-near-the-cap
    op: '/large'
    local_only: true
    reference: CS-NC-003
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-large-near-cap.yaml", --paths, "/large", --format, json]
    exit: 0
    passed: true
  - name: large-binary-over-the-cap
    op: '/large'
    local_only: true
    reference: CS-NC-003
    note: "51 MB: cut off, still a pass because binary bodies are not compared"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-large-over-cap.yaml", --paths, "/large", --format, json]
    exit: 0
    passed: true
  - name: large-json-near-the-cap
    op: '/large/json'
    local_only: true
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-large-near-cap.yaml", --paths, "/large/json", --format, json]
    exit: 0
    passed: true
  - name: large-json-over-the-cap
    op: '/large/json'
    local_only: true
    check: CS-RESP-013
    note: "valid JSON over the 50 MB read limit is reported as too large, not as a syntax error"
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-large-over-cap.yaml", --paths, "/large/json", --format, json]
    exit: 1
    finding: { kind: body-too-large, check: CS-RESP-013, message: 'larger than the 50 MB Clear Signal reads' }

  # CS-RUN-005: an unset ${NAME} in the environment file is only a warning; the exit code is unchanged.
  - name: run-005-unset-environment-variable
    check: CS-RUN-005
    unset: [CLRSIG_UNSET_FIXTURE_VAR]
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail-unset-var.yaml", --paths, "/strict/no-auth", --format, json]
    exit: 0
    passed: true
    output: 'environment variable CLRSIG_UNSET_FIXTURE_VAR is not set'

  # CS-RUN-007, the other half: a bad function in the scenario's own `variables:` means the scenario
  # cannot start (exit 2, nothing sent), unlike a bad function in a step (run-002b).
  - name: run-007-bad-function-in-a-scenario-variable
    check: CS-RUN-007
    args: [run, "{root}/clrsig/scenarios/conform-fail-bad-variable.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 2
    output: 'variable "broken".*unknown function \$noSuchFunction'
    not_output: 'never sent\s+200'

  # CS-RUN-001 in a scenario: a step with no value for a placeholder is not sent (v0.8.4, F-023); the
  # next step still runs.
  - name: run-001b-missing-value-in-a-scenario
    check: CS-RUN-001
    args: [run, "{root}/clrsig/scenarios/conform-fail-missing-value.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 1
    output: '(?s)FAIL\s+missing value\s+error: not sent: no value for \{\{nothing\}\}.*PASS\s+good step'

  # "Not checked" states (CS-NC-004 to 006): a response that is not compared with the spec. The same
  # /ghost request is a violation when checked (`ghost checked`), and clrsig counts the others in
  # its summary line.
  - name: nc-004-validate-spec-off
    reference: CS-NC-004
    args: [run, "{root}/clrsig/scenarios/conform-fail-spec-check-states.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 1
    output: '(?s)PASS\s+validation off\s+404.*FAIL\s+ghost checked.*declares only 200.*spec validation is turned off for this step: 1'
  - name: nc-006-step-did-not-complete
    reference: CS-NC-006
    args: [run, "{root}/clrsig/scenarios/conform-fail-spec-check-states.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 1
    output: 'the step did not complete: 1'
  - name: nc-005-no-spec
    reference: CS-NC-005
    note: "without --spec the same /ghost step passes and no 'Spec:' summary line is printed"
    args: [run, "{root}/clrsig/scenarios/conform-fail-spec-check-states.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml"]
    exit: 1
    output: '(?s)PASS\s+ghost checked\s+404'
    not_output: 'responses were not compared with the spec'

  # CS-PROBE-005: --paths limits the probes, and the JSON and JUnit reports carry them.
  - name: probe-005-paths-limit-the-probes
    reference: CS-PROBE-005
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail.yaml", --negative, --paths, "/strict/missing-field"]
    exit: 0
    output: 'PASSED\s+2 probes'
    not_output: '/(lenient|strict/(?!missing-field))\S+ —'
  - name: probe-005-json-report-has-the-probes
    reference: CS-PROBE-005
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail.yaml", --negative, --paths, "/strict/missing-field", --format, json]
    exit: 0
    output: '"kind": "drop_required_field"'
  - name: probe-005-junit-report-has-the-probes
    reference: CS-PROBE-005
    args: [conform, "{spec}", -b, "{fbase}", --env, "{root}/clrsig/environments/conform-fail.yaml", --negative, --paths, "/strict/missing-field", --format, junit]
    exit: 0
    output: "missing required field (&#39;|')name"

  # ---- the adversarial group, part two: documents (specs/hostile/). No server is needed: `generate
  # --dry-run` reads and builds, and `conform --negative` against a closed port builds every request and
  # probe (the connection errors are expected). Valid but awkward specs must load; invalid ones must exit 2
  # with a message, never crash or hang. ----
  - name: hostile-spec-circular-ref
    reference: null
    note: "a schema that contains itself (parent, children): both operations are generated"
    args: [generate, "{root}/specs/hostile/circular-ref.yaml", --dry-run]
    exit: 0
    output: '2 request\(s\) generated'
  - name: hostile-spec-recursive-allof
    reference: null
    note: "allOf of a base and a schema that refers back to itself"
    args: [generate, "{root}/specs/hostile/recursive-allof.yaml", --dry-run]
    exit: 0
    output: '1 request\(s\) generated'
  - name: hostile-spec-discriminator-probes-both-branches
    reference: CS-PROBE-003
    note: "oneOf with a discriminator and a mapping: probes for both branches (4 each)"
    args: [conform, "{root}/specs/hostile/discriminator.yaml", -b, "http://localhost:1", --request-timeout, "300", --negative]
    exit: 1
    output: "(?s)missing required field .kind. of branch 1.*missing required field .bark. of branch 2.*wrong type for field .bark. of branch 2"
  - name: hostile-spec-many-branches
    reference: null
    note: "oneOf with 60 branches: 120 probes, quickly"
    args: [conform, "{root}/specs/hostile/many-branches.yaml", -b, "http://localhost:1", --request-timeout, "300", --negative]
    exit: 1
    output: "(?s)missing required field .f59. of branch 60"
  - name: hostile-spec-unsatisfiable-schema
    reference: null
    note: "allOf of a string and an integer can never be satisfied: a request is still generated, nothing hangs"
    args: [generate, "{root}/specs/hostile/unsatisfiable.yaml", --dry-run]
    exit: 0
    output: '1 request\(s\) generated'
  - name: hostile-spec-deep-schema
    reference: null
    note: "a request body schema nested 120 levels"
    args: [generate, "{root}/specs/hostile/deep-schema.yaml", --dry-run]
    exit: 0
    output: '1 request\(s\) generated'
  - name: hostile-spec-path-templates
    reference: null
    note: "two parameters and a dot, a trailing slash, a non-ASCII path"
    args: [generate, "{root}/specs/hostile/path-templates.yaml", --dry-run]
    exit: 0
    output: '3 request\(s\) generated'
  - name: hostile-spec-no-paths
    reference: null
    args: [generate, "{root}/specs/hostile/no-paths.yaml", --dry-run]
    exit: 0
    output: '0 request\(s\) generated'
  - name: hostile-spec-json-file
    reference: null
    note: "the spec is a JSON document"
    args: [generate, "{root}/specs/hostile/json-spec.json", --dry-run]
    exit: 0
    output: '1 request\(s\) generated'
  - name: hostile-spec-openapi-3-2
    reference: null
    note: "openapi 3.2.0 is newer than the catalog; it loads like 3.1"
    args: [generate, "{root}/specs/hostile/openapi-3.2.yaml", --dry-run]
    exit: 0
    output: '1 request\(s\) generated'
  - name: hostile-spec-missing-ref
    reference: CS-RUN-004
    note: "a $ref to a schema that does not exist: a clean error, exit 2"
    args: [generate, "{root}/specs/hostile/missing-ref.yaml", --dry-run]
    exit: 2
    output: 'failed to resolve "components".*#/components/schemas/Nope'
  - name: hostile-spec-xml-example
    reference: F-034
    note: "a valid XML example string is rejected as 'value must be an object' (F-034)"
    args: [generate, "{root}/specs/hostile/xml-example.yaml", --dry-run]
    exit: 2
    output: 'invalid example: value must be an object'
  - name: hostile-spec-duplicate-operation-id
    reference: CS-RUN-004
    args: [generate, "{root}/specs/hostile/duplicate-operation-id.yaml", --dry-run]
    exit: 2
    output: 'have the same operation id "same"'
  - name: hostile-spec-undeclared-path-parameter
    reference: CS-RUN-004
    args: [generate, "{root}/specs/hostile/undeclared-path-param.yaml", --dry-run]
    exit: 2
    output: 'must define exactly all path parameters \(missing: \[id\]\)'
  - name: hostile-spec-identical-diff
    reference: null
    note: "diff of a recursive spec with itself: no changes, no loop"
    args: [diff, "{root}/specs/hostile/circular-ref.yaml", "{root}/specs/hostile/circular-ref.yaml"]
    exit: 0
    output: 'No changes'
  - name: failed-extraction-fails-the-run
    check: CS-RUN-008
    note: "the only problem is an extraction that finds nothing: since v0.8.5 the run exits 1 and says FAILED (it exited 0, F-032)"
    args: [run, "{root}/clrsig/scenarios/conform-fail-failed-extraction.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 1
    output: '(?s)FAIL\s+extract nothing.*FAILED\s+0 passed, 1 failed'
  - name: probe-summary-says-failed-when-all-errored
    reference: CS-PROBE-006
    note: "no server: every probe errors; since v0.8.5 the headline says FAILED, as the exit code does (F-029)"
    args: [conform, "{root}/specs/hostile/only-post.yaml", -b, "http://localhost:1", --negative, --env, "{root}/clrsig/environments/ok.yaml", --request-timeout, "300"]
    exit: 1
    output: '(?s)FAILED\s+2 probes\s+·\s+0 passed\s+·\s+0 failed\s+·\s+0 skipped\s+·\s+2 errors.*could not be judged'

  # ---- scale: a generated document with 500 operations (scripts/make_specs.py). It must load, generate,
  # build every request and probe, and compare with itself, each well inside the time budget. ----
  - name: scale-500-generate
    reference: null
    args: [generate, "{bigspec}", --dry-run]
    exit: 0
    output: '500 request\(s\) generated'
    max_seconds: 10
  - name: scale-500-diff-with-itself
    reference: null
    args: [diff, "{bigspec}", "{bigspec}"]
    exit: 0
    output: 'No changes'
    max_seconds: 10
  - name: scale-500-conform-negative
    reference: null
    note: "against a closed port, with no values for the path parameters: nothing is sent and the run still finishes"
    args: [conform, "{bigspec}", -b, "http://localhost:1", --request-timeout, "100", --negative]
    exit: 1
    output: 'FAILED\s+500 operations\s+·\s+0 passed\s+·\s+500 failed'
    max_seconds: 30

# Coverage signals (catalog 2.3): a scenario that deliberately leaves one gap of each kind, run into
# a fresh workspace, then `clrsig coverage quality --format json`. The spec is the four-operation
# subset in specs/coverage/coverage.yaml. The signals are not failures: the command exits 0.
coverage:
  spec: specs/coverage/coverage.yaml
  scenario: clrsig/scenarios/coverage-gaps.yaml
  env: clrsig/environments/conform-fail.yaml
  exit: 0
  totals: { total: 4, covered: 3, notCovered: 1, passing: 3, failing: 0 }
  never_exercised: ['POST /strict/wrong-type']            # CS-COV-001
  happy_path_only: ['GET /strict/missing-query']          # CS-COV-002
  errors_never_triggered:                                 # CS-COV-003
    - { op: 'GET /strict/missing-query', missing: [400] }
  secured_never_authed: ['GET /strict/no-auth']           # CS-COV-004

# The baseline ratchet (CS-RUN-006). The drift level is set at startup (--drift=<n>) and never changes
# while the server runs, so the runner starts one real server per drift level on a free port.
# Drift 0 behaves as documented; drift 1 breaks one NEW operation (GET /drift/report).
drift:
  paths: [/ghost, /orphan, /wrong-method, /drift/report]
  steps:
    - { name: record-the-baseline-at-drift-0, drift: 0, mode: write, file: zero, exit: 0, output: 'Baseline written: 3 violations recorded' }
    - { name: drift-0-against-its-own-baseline, drift: 0, mode: use, file: zero, exit: 0, output: 'Baseline: 3 known, 0 new, 0 fixed' }
    - { name: drift-1-has-one-new-violation, drift: 1, mode: use, file: zero, exit: 1, check: CS-RUN-006, output: 'Baseline: 3 known, 1 new, 0 fixed', new: ['GET /drift/report'] }
    - { name: record-a-baseline-at-drift-1, drift: 1, mode: write, file: one, exit: 0, output: 'Baseline written: 4 violations recorded' }
    - { name: drift-0-fixes-one-violation, drift: 0, mode: use, file: one, exit: 0, output: 'Baseline: 3 known, 0 new, 1 fixed', fixed: ['GET /drift/report'] }
    - { name: a-missing-baseline-file-is-an-error, drift: 0, mode: use-missing, file: none, exit: 2, output: 'reading baseline' }

# What ClearSignal builds from the spec (clrsig generate): every operation but the callback.
generation:
  operations: 76              # one per operation under paths; the callback is not among them (CS-GAP-010)
  with_body: [subscribe, lenientMissingField, formBody, multipartBody]   # JSON, form and multipart bodies are generated
  not_generated: [onEventCallback]

# The undocumented route and the step spec check (checker A) on declared-but-unserved routes.
scenarios:
  - file: clrsig/scenarios/conform-fail-routes.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      undocumented: { spec_check: ok, schema_assertion: none, reference: CS-NC-001, note: "the server has it, the spec does not: nothing is compared, and no report format shows 'not checked'" }
      ghost:        { spec_check: violation, schema_assertion: none, check: CS-RESP-001 }
      orphan:       { spec_check: violation, schema_assertion: none, check: CS-RESP-001 }

  # Three write bugs only a scenario can see. The steps assert the CORRECT behavior, so a step
  # fails exactly where the server is wrong (passed: false).
  - file: clrsig/scenarios/conform-fail-write-bugs.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      reset:                          { passed: true }
      first request with a key:       { passed: true }
      same key again:                 { passed: true }
      one record for one key:         { passed: false, note: "BUG: a repeated Idempotency-Key created a second record" }
      read value and ETag:            { passed: true }
      first writer:                   { passed: true }
      stale writer is refused:        { passed: false, note: "BUG: If-Match is ignored, the stale writer got 200" }
      "first writer's value survives": { passed: false, note: "BUG: the stale writer overwrote the first writer's value" }
      timed-out write:                { passed: false, error: 'context deadline exceeded', note: "the request timed out ..." }
      the write took effect anyway:   { passed: true, note: "... yet the record exists: a retry would duplicate it" }

  # The hostile bodies read by a scenario: each step asserts what a reader would expect, so
  # `passed: false` marks where clrsig disagrees (the note says why).
  - file: clrsig/scenarios/conform-fail-edge-assertions.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      duplicate header, first value: { passed: false, note: "a repeated header is one value joined with ', ' since v0.8.5, so eq one fails (F-030)" }
      duplicate header, joined: { passed: true, note: "CS-RUN-009: the repeated header is one joined value" }
      set-cookie header: { passed: true, note: "both cookies are in the joined value (F-030, fixed in v0.8.5)" }
      gzip body is decoded: { passed: true }
      integer written as 1.0: { passed: true }
      integer written as 1e2: { passed: true }
      integer one above int64: { passed: true, note: "CS-RUN-009: keeps all its digits since v0.8.5 (F-031)" }
      number beyond float64: { passed: false, note: "1e400 cannot be read (F-028)" }
      duplicate keys: { passed: false, note: "the last key wins: id is the string two" }
      deep nesting: { passed: true }
      wide object: { passed: true }
      body with a byte order mark: { passed: false, note: "a BOM is rejected, as by conform" }
      text after the JSON value: { passed: false, note: "rejected here and, since v0.8.5, by conform too (F-027)" }
      a string compared with gt: { passed: false, note: "cannot compare the string as a number: a clear message" }
      extraction that finds nothing: { passed: false, error: 'extraction "absent": jsonpath "\$\.nothing\.here": unknown key nothing', note: "a failed extraction fails the step since v0.8.5 (F-032)" }
      use of the value that was not extracted: { passed: false, error: 'not sent: no value for \{\{absent\}\}' }
      read an id above 2^53 into a variable: { passed: true, extracted: { bigId: "9223372036854775808" }, note: "the id keeps its digits since v0.8.5 (F-031)" }
      extraction from a header that is not there: { passed: false, error: 'header "X-Not-There" not found in response', note: "as above (F-032)" }

# `clrsig conform --negative`: each operation's negative probes (see the header).
  # Seven business rules, each broken on purpose: the steps assert the CORRECT rule, so exactly the
  # steps on the broken rules fail (passed: false). The stale If-Match rule is the lost-update
  # scenario above.
  - file: clrsig/scenarios/conform-fail-business-rules.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      reset:                                              { passed: true }
      an order above the stock is refused:                { passed: false, note: "RULE: stock. Accepted (201) instead of 422" }
      the stock stays at zero or more:                    { passed: false, note: "RULE: stock. The stock is -3" }
      create an order within the stock:                   { passed: true }
      ship it:                                            { passed: true }
      a shipped order cannot be cancelled:                { passed: false, note: "RULE: order states. 200 instead of 409" }
      first customer:                                     { passed: true }
      a duplicate email is refused:                       { passed: false, note: "RULE: unique values. 201 instead of 409" }
      withdrawing more than the balance is a 422:         { passed: false, note: "RULE: insufficient funds. 200 with an error body instead of 422" }
      page 1:                                             { passed: true }
      page 2 does not repeat the last item of page 1:     { passed: false, note: "RULE: stable pagination. i-3 appears on both pages" }
      a valid token is accepted:                          { passed: true }
      an expired token is refused:                        { passed: false, note: "RULE: expiry. 200 instead of 401" }

probes:
  # ---- lenient: each fails exactly one probe kind ----
  - { op: /lenient/missing-field, probes: 2, fail: [{ probe: "missing required field 'name'", check: CS-PROBE-001 }] }
  - { op: /lenient/wrong-type, probes: 2, fail: [{ probe: "wrong type for field 'quantity'", check: CS-PROBE-002 }] }
  - { op: /lenient/missing-query, probes: 1, fail: [{ probe: "missing required query param 'q'", check: CS-PROBE-003 }] }
  - { op: /lenient/no-auth, probes: 1, fail: [{ probe: "no credentials", check: CS-PROBE-004 }] }

  # ---- lenient, but in ways ClearSignal does not probe today: pass, pinning the gaps ----
  - { op: /lenient/wrong-auth, probes: 1, fail: [], reference: CS-GAP-008, why: "a wrong token is not probed; only missing credentials are" }
  - { op: /lenient/enum-and-boundary, probes: 4, fail: [], reference: CS-GAP-009, why: "enum and boundary violations are not probed" }
  - { op: /lenient/unknown-fields, probes: 2, fail: [], reference: CS-GAP-009, why: "unknown fields are not probed" }

  # ---- strict: the control group, every probe is rejected ----
  - { op: /strict/missing-field, probes: 2, fail: [], reference: null, why: control }
  - { op: /strict/wrong-type, probes: 2, fail: [], reference: null, why: control }
  - { op: /strict/missing-query, probes: 1, fail: [], reference: null, why: control }
  - { op: /strict/no-auth, probes: 1, fail: [], reference: null, why: control }
  - { op: /strict/wrong-auth, probes: 1, fail: [], reference: null, why: control }
  - { op: /strict/enum-and-boundary, probes: 4, fail: [], reference: null, why: control }
  - { op: /strict/unknown-fields, probes: 2, fail: [], reference: null, why: control }

  # ---- slice 2 operations that generate probes ----
  - { op: /wrong-method, probes: 2, fail: [], reference: CS-RESP-001, why: "a probe passes on any 4xx, so the 405 for the unimplemented PATCH counts as a rejection" }
  - { op: /subscribe, probes: 2, fail: [], reference: null, why: "the server validates the callback URL strictly" }
  - { op: /requests/body-value, probes: 2, fail: [], reference: null, why: "the server validates the number strictly" }
  - { op: /large, probes: 1, fail: [], reference: null, why: "a missing mb is rejected" }
  - { op: /large/json, probes: 1, fail: [], reference: null, why: "a missing mb is rejected" }
  - { op: /rules/orders, probes: 2, fail: [], reference: null, why: "the body is validated" }
  - { op: /rules/customers, probes: 2, fail: [], reference: null, why: "the body is validated" }
  - { op: /rules/withdrawals, probes: 2, fail: [], reference: null, why: "the body is validated" }
  - { op: /rules/protected, probes: 1, fail: [], reference: null, why: "missing credentials are rejected; the expired token is not probed (CS-GAP-008)" }
  - { op: /lost-update, probes: 3, fail: [{ probe: "missing required header 'If-Match'", check: CS-PROBE-003 }] }   # the server ignores If-Match altogether
