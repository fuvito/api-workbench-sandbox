# Expected ClearSignal outcome for the conform-fail cases.
#
# Same conventions as expectations/contract-fail.yaml (read its header). Sections in this file:
#   probes   `clrsig conform --negative`: each operation's negative probes. ClearSignal prints no
#            check IDs and puts no probe in JSON/JUnit (F-014) and ignores --paths for probes
#            (F-013), so the runner runs `--negative` once and reads the text report.
#            `probes` is how many probes ClearSignal generates for the operation: when that
#            changes (for example the day it probes enums or unknown fields, CS-GAP-009) the case
#            must be reviewed. `fail` lists the probe descriptions that must FAIL, with their ID.
#
# Run: uv run python scripts/check_expectations.py --expectations expectations/conform-fail.yaml
#
# Holds for clrsig v0.7.1 through the F-010 spec copy. Do not edit a spec or handler to change
# an expectation.

format: 1
family: conform-fail
spec: specs/conform-fail.yaml
prefix: /conform-fail
env: clrsig/environments/conform-fail.yaml
ignore: [/health]

# Probe kinds as ClearSignal words them in the text report (catalog 2.2).
probe_kinds:
  "missing required field": CS-PROBE-001
  "wrong type for field": CS-PROBE-002
  "missing required query param": CS-PROBE-003
  "no credentials": CS-PROBE-004

# ---- spec and server disagree about what exists (slice 2) ----
# Plain `conform` on each operation. A declared route the server does not serve answers 404/405/400,
# which the spec does not declare: CS-RESP-001 every time (the notes' "and a conformance failure").
cases:
  - { case: ghost, path: /ghost, expect: fail, check: CS-RESP-001, kind: undeclared-status, message: 'answered 404, but the spec declares only 200' }
  - { case: orphan, path: /orphan, expect: fail, check: CS-RESP-001, kind: undeclared-status, message: 'answered 405, but the spec declares only 204' }
  - { case: wrong-method, path: /wrong-method, expect: fail, check: CS-RESP-001, kind: undeclared-status, message: 'answered 405, but the spec declares only 200' }
  - { case: path-param-type, path: '/path-param/{id}', expect: fail, check: CS-RESP-001, kind: undeclared-status, message: 'answered 400, but the spec declares only 200' }
  - { case: requires-extra-header, path: /requires-extra-header, expect: fail, check: CS-RESP-001, kind: undeclared-status, message: 'answered 400, but the spec declares only 201' }
  # CS-GAP-006: ClearSignal cannot build form or multipart bodies. Because the body is `required`,
  # its own bodiless request fails validation and the operation FAILS although server and spec agree
  # (F-015). Recorded as what happens today; the check is the request-body one (CS-REQ-002).
  - { case: form-body, path: /form, expect: fail, check: CS-REQ-002, kind: request, message: 'request body does not fit the spec: value is required but missing', note: "consequence of CS-GAP-006, see F-015" }
  - { case: multipart-body, path: /multipart, expect: fail, check: CS-REQ-002, kind: request, message: 'request body does not fit the spec: value is required but missing', note: "consequence of CS-GAP-006, see F-015" }
  # CS-GAP-010: the callback is not under paths and is never exercised; the operation that declares it passes.
  - { case: subscribe-with-callback, path: /subscribe, expect: pass, reference: CS-GAP-010, why: "the callback is not exercised and the server never contacts it" }

  # ---- slice 3 controls: the same operations pass with the right environment ----
  - { case: requests-param-type-ok, path: '/requests/param-type/{itemId}', expect: pass, reference: null, why: "itemId=7 from the right environment: a valid request, a correct response" }
  - { case: requests-body-value-ok, path: /requests/body-value, expect: pass, reference: null, why: "amount=19.99 from the right environment" }

  # ---- slice 4: timing and instability ----
  # ClearSignal does not measure response time (CS-GAP-005, improvement request F-018), so timing
  # shows only through timeouts: a case "outlasts" a timeout when `args` sets a short one.
  # `local_only` marks transport behavior not verified on Cloud Run (run with --cloud to skip).
  - { case: slow, path: /slow, args: ['--request-timeout', 1500], expect: fail, check: CS-RUN-003, kind: no-response, message: 'context deadline exceeded', note: "15 s against a 1.5 s timeout" }
  - { case: latency-within-timeout, path: '/latency/{ms}', expect: pass, reference: CS-GAP-005, why: "200 ms answered correctly; response time is not measured" }
  - { case: unavailable, path: /unavailable, expect: fail, check: CS-RESP-001, kind: undeclared-status, message: 'answered 503, but the spec declares only 200' }
  - { case: redirect-loop, path: /redirect-loop, expect: fail, check: CS-RUN-003, kind: no-response, message: 'stopped after 10 redirects' }
  - { case: hang, path: /timeout/hang, args: ['--request-timeout', 1500], local_only: true, expect: fail, check: CS-RUN-003, kind: no-response, message: 'context deadline exceeded' }
  - { case: slow-headers-outlasts-timeout, path: /timeout/slow-headers, args: ['--request-timeout', 1500], local_only: true, expect: fail, check: CS-RUN-003, kind: no-response, message: 'executing request.*context deadline exceeded' }
  - { case: slow-headers-within-timeout, path: /timeout/slow-headers, local_only: true, expect: pass, reference: CS-GAP-005, why: "4 s against the default 10 s timeout" }
  - { case: slow-body, path: /timeout/slow-body, args: ['--request-timeout', 3000], local_only: true, expect: fail, check: CS-RUN-003, kind: no-response, message: 'reading response body: context deadline exceeded', note: "headers arrive at once; the timeout hits while reading the body" }
  - { case: truncated-body, path: /timeout/truncated-body, local_only: true, expect: fail, check: CS-RUN-003, kind: no-response, message: 'reading response body: unexpected EOF', note: "the notes said CS-RUN-003 or CS-RESP-008: it is CS-RUN-003 (no response)" }
  - { case: connection-reset, path: /timeout/connection-reset, local_only: true, expect: fail, check: CS-RUN-003, kind: no-response, message: 'EOF' }
  - { case: large-1mb, path: /large, expect: pass, reference: CS-NC-003, why: "a binary body is not compared" }
  - { case: large-json-1mb, path: /large/json, expect: pass, reference: null, why: "a valid 1 MB JSON body" }
  - { case: after-write-outlasts-timeout, path: /timeout/after-write, args: ['--request-timeout', 1500], local_only: true, expect: fail, check: CS-RUN-003, kind: no-response, message: 'context deadline exceeded', note: "the write still took effect, see the scenario" }
  - { case: after-write-records, path: /timeout/after-write/records, expect: pass, reference: null, why: "the records written so far" }
  - { case: idempotent-create, path: /idempotent, expect: pass, reference: null, why: "a single request cannot show the missing idempotency; see the scenario" }
  - { case: idempotent-records, path: /idempotent/records, expect: pass, reference: null, why: "the records created so far" }
  - { case: lost-update, path: /lost-update, operations: 2, expect: pass, reference: null, why: "GET and PUT each conform; the lost update shows only in a scenario" }
  - { case: drift-report-at-drift-0, path: /drift/report, expect: pass, reference: null, why: "the default drift level: total is an integer; at drift 1 it becomes a string (see the drift section)" }
  # ---- slice 5: business rules the server breaks (the contract checks cannot see them) ----
  - { case: rules-stock, path: /rules/stock, expect: pass, reference: null, why: "a correct response; the rule is broken elsewhere" }
  - { case: rules-create-order, path: /rules/orders, expect: pass, reference: null, why: "quantity 1 is within the stock; the response matches the spec" }
  - { case: rules-ship-order, path: '/rules/orders/{orderId}/ship', expect: pass, reference: null, why: "200 or the declared 409, whichever state o-1 is in" }
  - { case: rules-cancel-order, path: '/rules/orders/{orderId}/cancel', expect: pass, reference: null, why: "200 (also for a shipped order, the broken rule) or the declared 409" }
  - { case: rules-create-customer, path: /rules/customers, expect: pass, reference: null, why: "the first customer; the duplicate is only visible in a scenario" }
  - { case: rules-items, path: /rules/items, expect: pass, reference: null, why: "a valid page; the repeat only shows across two pages" }
  - { case: rules-protected-token-not-known, path: /rules/protected, expect: pass, reference: null, why: "ClearSignal's test-token is unknown here: the declared 401" }
  - { case: rules-withdraw-insufficient-funds, path: /rules/withdrawals, expect: fail, check: CS-RESP-005, kind: missing-field, where: id, message: 'property "id" is missing', note: "500 is above the balance: the declared 422 is answered 200 with an error body; the notes: CS-RESP-001 if 200 is declared with another shape, else a scenario assertion" }

# State-dependent behavior: reset, then call the operation several times and compare call by call.
# Every counter lives in the store, so the same reset always gives the same sequence.
sequences:
  - { name: flaky-every-third-call, path: /flaky, outcomes: [pass, pass, fail, pass, pass, fail], check: CS-RESP-001, fail: { kind: undeclared-status, message: 'answered 500, but the spec declares only 200' } }
  - { name: rate-limited-after-three-calls, path: /rate-limited, outcomes: [pass, pass, pass, fail, fail, fail], check: CS-RESP-001, fail: { kind: undeclared-status, message: 'answered 429, but the spec declares only 200' } }
  - { name: unavailable-then-ok, path: /unavailable-then-ok, outcomes: [fail, fail, pass, pass], check: CS-RESP-001, fail: { kind: undeclared-status, message: 'answered 503, but the spec declares only 200' } }
  # Delays 100, 400, 700, 1000, 1300 ms against an 850 ms timeout (150 ms margins).
  - { name: degrading-latency, path: /latency/degrading, args: ['--request-timeout', 850], outcomes: [pass, pass, pass, fail, fail], check: CS-RUN-003, fail: { kind: no-response, message: 'context deadline exceeded' } }
  # Seeded delays 160, 906, 477, 477, 507, 264 ms against a 700 ms timeout (at least 190 ms margins),
  # and the same sequence again after another reset: jitter that repeats.
  - { name: seeded-jitter-repeats, path: /latency/jitter, args: ['--request-timeout', 700], repeat: 2, outcomes: [pass, fail, pass, pass, pass, pass], check: CS-RUN-003, fail: { kind: no-response, message: 'context deadline exceeded' } }

# The whole spec in one run, after a reset and with a 3 s request timeout, so the slow cases time out
# and the counters are all at their first call. Only the paths listed here may fail.
whole_spec:
  reset: true
  request_timeout: 3000
  failing:
    - /ghost
    - /orphan
    - /wrong-method
    - '/path-param/{id}'
    - /requires-extra-header
    - /form
    - /multipart
    - /slow
    - /unavailable
    - /unavailable-then-ok
    - /redirect-loop
    - /timeout/hang
    - /timeout/slow-headers
    - /timeout/slow-body
    - /timeout/truncated-body
    - /timeout/connection-reset
    - /timeout/after-write
    - /rules/withdrawals

# ---- requests that do not fit, and runs that cannot happen (slice 3) ----
# Whole commands: the wrong environment files are next to the right one in clrsig/environments/.
# `finding.kind` is clrsig's JSON kind; `output` is a regex over everything the command printed.
runs:
  # CS-REQ-001 / CS-REQ-002: a value from the environment does not fit the declared type.
  - name: req-001-wrong-parameter-type
    check: CS-REQ-001
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-bad-values.yaml", --paths, /conform-fail/requests/param-type, --format, json]
    exit: 1
    finding: { kind: request, message: 'path parameter "itemId" does not fit the spec: value abc' }
  - name: req-002-wrong-body-value
    check: CS-REQ-002
    note: "the body message is the JSON parser's text (F-017)"
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-bad-values.yaml", --paths, /conform-fail/requests/body-value, --format, json]
    exit: 1
    finding: { kind: request, message: 'request body does not fit the spec: invalid character' }

  # CS-RUN-001 / CS-RUN-002: the request is not sent. Both share the finding kind `missing-value`.
  - name: run-001-missing-placeholder
    check: CS-RUN-001
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-missing-value.yaml", --paths, /conform-fail/requests/param-type, --format, json]
    exit: 1
    finding: { kind: missing-value, message: 'not sent: no value for \{\{itemId\}\}' }
  - name: run-002-bad-dynamic-function-in-environment
    check: CS-RUN-002
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-bad-function.yaml", --paths, /conform-fail/requests/param-type, --format, json]
    exit: 1
    finding: { kind: missing-value, message: 'unknown function \$noSuchFunction' }
  - name: run-002b-bad-dynamic-function-in-scenario
    check: CS-RUN-002
    note: "in a scenario the whole run aborts with exit 2 before any step (F-016)"
    args: [run, "{root}/clrsig/scenarios/conform-fail-bad-function.yaml", --env, "{root}/clrsig/environments/conform-fail.yaml", --spec, "{spec}"]
    exit: 2
    output: 'unknown function \$noSuchFunction'

  # CS-RUN-003: no response.
  - name: run-003-server-down-wrong-base-url
    check: CS-RUN-003
    args: [conform, "{spec}", -b, "http://localhost:1", --paths, /conform-fail/health, --format, json]
    exit: 1
    finding: { kind: no-response, message: 'executing request' }

  # CS-RUN-004: the spec cannot be read (exit code 2, an error rather than a failure).
  - name: run-004a-unreadable-yaml
    check: CS-RUN-004
    args: [conform, "{root}/clrsig/fixtures/unreadable-yaml.yaml", -b, "{base}"]
    exit: 2
    output: 'parsing spec: loading spec: failed to unmarshal data'
  - name: run-004b-not-an-openapi-document
    check: CS-RUN-004
    args: [conform, "{root}/clrsig/fixtures/not-openapi.yaml", -b, "{base}"]
    exit: 2
    output: 'invalid OpenAPI spec: value of openapi must be a non-empty string'
  - name: run-004c-spec-file-missing
    check: CS-RUN-004
    args: [conform, "{root}/clrsig/fixtures/does-not-exist.yaml", -b, "{base}"]
    exit: 2
    output: 'reading spec: open '
  - name: run-004d-spec-url-returns-404
    check: CS-RUN-004
    args: [conform, "{base}/conform-fail/nope.yaml"]
    exit: 2
    output: 'server returned 404'

  # ---- slice 4: the default timeout, a fixed latency on both sides of the timeout, and the 50 MB cap ----
  - name: slow-outlasts-the-default-timeout
    check: CS-RUN-003
    note: "takes about 10 s: the default request timeout"
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail.yaml", --paths, /conform-fail/slow, --format, json]
    exit: 1
    finding: { kind: no-response, message: 'context deadline exceeded' }
  - name: latency-3s-with-a-1s-timeout
    op: '/latency/{ms}'
    check: CS-RUN-003
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-latency-3s.yaml", --paths, "/conform-fail/latency/", --request-timeout, "1000", --format, json]
    exit: 1
    finding: { kind: no-response, message: 'context deadline exceeded' }
  - name: latency-3s-with-a-6s-timeout
    op: '/latency/{ms}'
    reference: CS-GAP-005
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-latency-3s.yaml", --paths, "/conform-fail/latency/", --request-timeout, "6000", --format, json]
    exit: 0
    passed: true
  # The client reads at most 50 MB and cuts the rest off without a word (F-019).
  - name: large-binary-near-the-cap
    op: '/large'
    local_only: true
    reference: CS-NC-003
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-large-near-cap.yaml", --paths, /conform-fail/large, --format, json]
    exit: 0
    passed: true
  - name: large-binary-over-the-cap
    op: '/large'
    local_only: true
    reference: CS-NC-003
    note: "51 MB: silently truncated, still a pass because binary bodies are not compared (F-019)"
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-large-over-cap.yaml", --paths, /conform-fail/large, --format, json]
    exit: 0
    passed: true
  - name: large-json-near-the-cap
    op: '/large/json'
    local_only: true
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-large-near-cap.yaml", --paths, /conform-fail/large/json, --format, json]
    exit: 0
    passed: true
  - name: large-json-over-the-cap
    op: '/large/json'
    local_only: true
    check: CS-RESP-008
    note: "valid JSON cut at 50 MB is reported as unexpected EOF: a false failure (F-019)"
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-large-over-cap.yaml", --paths, /conform-fail/large/json, --format, json]
    exit: 1
    finding: { kind: other, message: 'unexpected EOF' }

  # CS-RUN-005: an unset ${NAME} in the environment file is only a warning; the exit code is unchanged.
  - name: run-005-unset-environment-variable
    check: CS-RUN-005
    unset: [CLRSIG_UNSET_FIXTURE_VAR]
    args: [conform, "{spec}", -b, "{base}", --env, "{root}/clrsig/environments/conform-fail-unset-var.yaml", --paths, /conform-fail/strict/no-auth, --format, json]
    exit: 0
    passed: true
    output: 'environment variable CLRSIG_UNSET_FIXTURE_VAR is not set'

# Coverage signals (catalog 2.3): a scenario that deliberately leaves one gap of each kind, run into
# a fresh workspace, then `clrsig coverage quality --format json`. The spec is the four-operation
# subset in specs/coverage/coverage.yaml. The signals are meant to be "not failures", but the command
# exits 1 when it finds gaps (F-020). With the STANDARD spec (servers present) coverage matches no
# operation at all, the same cause as F-010: the second block pins that.
coverage:
  spec: specs/coverage/coverage.yaml
  scenario: clrsig/scenarios/coverage-gaps.yaml
  env: clrsig/environments/conform-fail.yaml
  exit: 1
  totals: { total: 4, covered: 3, notCovered: 1, passing: 3, failing: 0 }
  never_exercised: ['POST /strict/wrong-type']            # CS-COV-001
  happy_path_only: ['GET /strict/missing-query']          # CS-COV-002
  errors_never_triggered:                                 # CS-COV-003
    - { op: 'GET /strict/missing-query', missing: [400] }
  secured_never_authed: ['GET /strict/no-auth']           # CS-COV-004
  standard_spec: { covered: 0 }

# The baseline ratchet (CS-RUN-006). The drift level is set at startup (--drift=<n>) and never changes
# while the server runs, so the runner starts one real server per drift level on a free port.
# Drift 0 behaves as documented; drift 1 breaks one NEW operation (GET /drift/report).
drift:
  paths: [/ghost, /orphan, /wrong-method, /drift/report]
  steps:
    - { name: record-the-baseline-at-drift-0, drift: 0, mode: write, file: zero, exit: 0, output: 'Baseline written: 3 violations recorded' }
    - { name: drift-0-against-its-own-baseline, drift: 0, mode: use, file: zero, exit: 0, output: 'Baseline: 3 known, 0 new, 0 fixed' }
    - { name: drift-1-has-one-new-violation, drift: 1, mode: use, file: zero, exit: 1, check: CS-RUN-006, output: 'Baseline: 3 known, 1 new, 0 fixed', new: ['GET /drift/report'] }
    - { name: record-a-baseline-at-drift-1, drift: 1, mode: write, file: one, exit: 0, output: 'Baseline written: 4 violations recorded' }
    - { name: drift-0-fixes-one-violation, drift: 0, mode: use, file: one, exit: 0, output: 'Baseline: 3 known, 0 new, 1 fixed', fixed: ['GET /drift/report'] }
    - { name: a-missing-baseline-file-is-an-error, drift: 0, mode: use-missing, file: none, exit: 2, output: 'reading baseline' }

# What ClearSignal builds from the spec (clrsig generate): pins the two request-generation gaps.
generation:
  operations: 56              # one per operation under paths; the callback is not among them (CS-GAP-010)
  bodiless:                   # CS-GAP-006: the spec declares a body, ClearSignal writes none
    - { operation: formBody, media: application/x-www-form-urlencoded }
    - { operation: multipartBody, media: multipart/form-data }
  with_body: [subscribe, lenientMissingField]   # control: JSON bodies are generated
  not_generated: [onEventCallback]

# The undocumented route and the step spec check (checker A) on declared-but-unserved routes.
scenarios:
  - file: clrsig/scenarios/conform-fail-routes.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      undocumented: { spec_check: ok, schema_assertion: none, reference: CS-NC-001, note: "the server has it, the spec does not: nothing is compared, and no report format shows 'not checked'" }
      ghost:        { spec_check: violation, schema_assertion: none, check: CS-RESP-001 }
      orphan:       { spec_check: violation, schema_assertion: none, check: CS-RESP-001 }

  # Three write bugs only a scenario can see. The steps assert the CORRECT behavior, so a step
  # fails exactly where the server is wrong (passed: false).
  - file: clrsig/scenarios/conform-fail-write-bugs.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      reset:                          { passed: true }
      first request with a key:       { passed: true }
      same key again:                 { passed: true }
      one record for one key:         { passed: false, note: "BUG: a repeated Idempotency-Key created a second record" }
      read value and ETag:            { passed: true }
      first writer:                   { passed: true }
      stale writer is refused:        { passed: false, note: "BUG: If-Match is ignored, the stale writer got 200" }
      "first writer's value survives": { passed: false, note: "BUG: the stale writer overwrote the first writer's value" }
      timed-out write:                { passed: false, error: 'context deadline exceeded', note: "the request timed out ..." }
      the write took effect anyway:   { passed: true, note: "... yet the record exists: a retry would duplicate it" }

# `clrsig conform --negative`: each operation's negative probes (see the header).
  # Seven business rules, each broken on purpose: the steps assert the CORRECT rule, so exactly the
  # steps on the broken rules fail (passed: false). The stale If-Match rule is the lost-update
  # scenario above.
  - file: clrsig/scenarios/conform-fail-business-rules.yaml
    env: clrsig/environments/conform-fail.yaml
    steps:
      reset:                                              { passed: true }
      an order above the stock is refused:                { passed: false, note: "RULE: stock. Accepted (201) instead of 422" }
      the stock stays at zero or more:                    { passed: false, note: "RULE: stock. The stock is -3" }
      create an order within the stock:                   { passed: true }
      ship it:                                            { passed: true }
      a shipped order cannot be cancelled:                { passed: false, note: "RULE: order states. 200 instead of 409" }
      first customer:                                     { passed: true }
      a duplicate email is refused:                       { passed: false, note: "RULE: unique values. 201 instead of 409" }
      withdrawing more than the balance is a 422:         { passed: false, note: "RULE: insufficient funds. 200 with an error body instead of 422" }
      page 1:                                             { passed: true }
      page 2 does not repeat the last item of page 1:     { passed: false, note: "RULE: stable pagination. i-3 appears on both pages" }
      a valid token is accepted:                          { passed: true }
      an expired token is refused:                        { passed: false, note: "RULE: expiry. 200 instead of 401" }

probes:
  # ---- lenient: each fails exactly one probe kind ----
  - { op: /lenient/missing-field, probes: 2, fail: [{ probe: "missing required field 'name'", check: CS-PROBE-001 }] }
  - { op: /lenient/wrong-type, probes: 2, fail: [{ probe: "wrong type for field 'quantity'", check: CS-PROBE-002 }] }
  - { op: /lenient/missing-query, probes: 1, fail: [{ probe: "missing required query param 'q'", check: CS-PROBE-003 }] }
  - { op: /lenient/no-auth, probes: 1, fail: [{ probe: "no credentials", check: CS-PROBE-004 }] }

  # ---- lenient, but in ways ClearSignal does not probe today: pass, pinning the gaps ----
  - { op: /lenient/wrong-auth, probes: 1, fail: [], reference: CS-GAP-008, why: "a wrong token is not probed; only missing credentials are" }
  - { op: /lenient/enum-and-boundary, probes: 4, fail: [], reference: CS-GAP-009, why: "enum and boundary violations are not probed" }
  - { op: /lenient/unknown-fields, probes: 2, fail: [], reference: CS-GAP-009, why: "unknown fields are not probed" }

  # ---- strict: the control group, every probe is rejected ----
  - { op: /strict/missing-field, probes: 2, fail: [], reference: null, why: control }
  - { op: /strict/wrong-type, probes: 2, fail: [], reference: null, why: control }
  - { op: /strict/missing-query, probes: 1, fail: [], reference: null, why: control }
  - { op: /strict/no-auth, probes: 1, fail: [], reference: null, why: control }
