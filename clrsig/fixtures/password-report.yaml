schemaVersion: "1"
title: health - passwords written inside longer text
description: >
  Made-up passwords in a scenario variable and in expected values, as an address and as
  connection and query strings. Used to check that reports mask them (clrsig 0.13.3). The
  assertions fail on purpose, so that the report quotes what was expected.

variables:
  - name: database
    value: "redis://:pw-canary-1@cache.internal:6379"

steps:
  - label: Compare with an address and a connection string
    failPolicy: continue
    request:
      method: GET
      url: "{{baseUrl}}/health"
    assertions:
      - { type: jsonpath, path: "$.status", operator: eq, expected: "postgres://app:pw-canary-2@db.internal:5432/orders" }
      - { type: jsonpath, path: "$.status", operator: eq, expected: "Server=db;User Id=app;Password=pw-canary-3;" }
  - label: A password in the query string of an address that does not answer
    request:
      method: GET
      url: "http://localhost:1/items?user=app&password=pw-canary-4"
