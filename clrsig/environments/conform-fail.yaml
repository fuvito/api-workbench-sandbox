schemaVersion: "1"
name: conform-fail
variables:
  - name: baseUrl
    value: "http://localhost:8080/conform-fail"
  # Fixed fake credential for the secured lenient/strict operations.
  - name: token
    value: "test-token"
  # Path parameter for GET /path-param/{id}: a valid integer, as the spec declares it.
  - name: id
    value: "1"
  # Values for the operations under /requests (slice 3): valid, so those operations pass.
  - name: itemId
    value: "7"
  - name: amount
    value: "19.99"
  # Values for the timing cases (slice 4): a short fixed latency and a small large-body.
  - name: ms
    value: "200"
  - name: mb
    value: "1"
  # The seeded order for the /rules/orders/{orderId} operations (slice 5).
  - name: orderId
    value: "o-1"
