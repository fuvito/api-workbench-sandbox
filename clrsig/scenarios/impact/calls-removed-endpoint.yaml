schemaVersion: "1"
title: impact - a step that calls an operation the revision removes
description: >
  Calls GET /users/1. Against specs/diff/impact-hit (v1 -> v2) that operation is removed without
  deprecation, so `clrsig impact` reports this step (CS-IMP-001). Never run against a server.
steps:
  - label: Fetch user 1
    request: { method: GET, url: "{{baseUrl}}/users/1" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
