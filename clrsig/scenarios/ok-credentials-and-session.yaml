schemaVersion: "1"
title: ok - credentials, a cookie session and Link pagination
description: >
  What `conform` cannot do: probe wrong, expired or under-privileged credentials (CS-GAP-008 probes only
  their absence), carry a session in a cookie across steps, and follow a Link header. The server side is
  in specs/ok-features.yaml. Run with --spec specs/ok-features.yaml so every step is also checked
  against the spec.

steps:
  - label: Reset ok store
    request: { method: POST, url: "{{baseUrl}}/__admin/reset" }
    assertions:
      - { type: status, operator: eq, expected: 204 }
    failPolicy: stop

  - label: Valid token
    request:
      method: GET
      url: "{{baseUrl}}/features/credentials/profile"
      headers:
        - { name: Authorization, value: "Bearer test-token" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
      - { type: jsonpath, path: "$.scopes[0]", operator: eq, expected: "read" }
    failPolicy: continue

  - label: Unknown token
    request:
      method: GET
      url: "{{baseUrl}}/features/credentials/profile"
      headers:
        - { name: Authorization, value: "Bearer nope" }
    assertions:
      - { type: status, operator: eq, expected: 401 }
      - { type: header, path: WWW-Authenticate, operator: eq, expected: 'Bearer realm="ok"' }
    failPolicy: continue

  - label: Expired token
    request:
      method: GET
      url: "{{baseUrl}}/features/credentials/profile"
      headers:
        - { name: Authorization, value: "Bearer expired-token" }
    assertions:
      - { type: status, operator: eq, expected: 401 }
      - { type: header, path: WWW-Authenticate, operator: contains, expected: "the access token expired" }
    failPolicy: continue

  - label: Read-only token on the write area
    request:
      method: GET
      url: "{{baseUrl}}/features/credentials/write-area"
      headers:
        - { name: Authorization, value: "Bearer test-token" }
    assertions:
      - { type: status, operator: eq, expected: 403 }
    failPolicy: continue

  - label: Writer token on the write area
    request:
      method: GET
      url: "{{baseUrl}}/features/credentials/write-area"
      headers:
        - { name: Authorization, value: "Bearer writer-token" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
      - { type: jsonpath, path: "$.ok", operator: eq, expected: "true" }
    failPolicy: continue

  - label: Expired token on the write area
    request:
      method: GET
      url: "{{baseUrl}}/features/credentials/write-area"
      headers:
        - { name: Authorization, value: "Bearer expired-token" }
    assertions:
      - { type: status, operator: eq, expected: 401 }
    failPolicy: continue

  - label: Wrong password
    request:
      method: POST
      url: "{{baseUrl}}/features/session/login"
      body:
        type: json
        content: '{"user":"test-user","password":"wrong"}'
    assertions:
      - { type: status, operator: eq, expected: 401 }
    failPolicy: continue

  - label: Log in
    request:
      method: POST
      url: "{{baseUrl}}/features/session/login"
      body:
        type: json
        content: '{"user":"test-user","password":"test-pass"}'
    assertions:
      - { type: status, operator: eq, expected: 204 }
      - { type: header, path: Set-Cookie, operator: contains, expected: "session=sess-" }
    extractions:
      - { name: sessionCookie, source: header, path: Set-Cookie }
    failPolicy: stop

  - label: Session without sending the cookie back
    request: { method: GET, url: "{{baseUrl}}/features/session/me" }
    assertions:
      - { type: status, operator: eq, expected: 401 }
    failPolicy: continue

  - label: Session with the cookie sent back by hand
    request:
      method: GET
      url: "{{baseUrl}}/features/session/me"
      headers:
        - { name: Cookie, value: "{{sessionCookie}}" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
      - { type: jsonpath, path: "$.user", operator: eq, expected: "test-user" }
    failPolicy: continue

  - label: Log out
    request:
      method: POST
      url: "{{baseUrl}}/features/session/logout"
      headers:
        - { name: Cookie, value: "{{sessionCookie}}" }
    assertions:
      - { type: status, operator: eq, expected: 204 }
      - { type: header, path: Set-Cookie, operator: contains, expected: "Max-Age=0" }
    failPolicy: continue

  - label: The old session is dead
    request:
      method: GET
      url: "{{baseUrl}}/features/session/me"
      headers:
        - { name: Cookie, value: "{{sessionCookie}}" }
    assertions:
      - { type: status, operator: eq, expected: 401 }
    failPolicy: continue

  - label: First page
    request: { method: GET, url: "{{baseUrl}}/features/links/items?page=1&per_page=4" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
      - { type: jsonpath, path: "$[0].n", operator: eq, expected: "1" }
      - { type: header, path: Link, operator: contains, expected: 'rel="next"' }
      - { type: header, path: X-Total-Count, operator: eq, expected: "10" }
    extractions:
      - { name: linkHeader, source: header, path: Link }
    failPolicy: continue

  - label: Last page has no next
    request: { method: GET, url: "{{baseUrl}}/features/links/items?page=3&per_page=4" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
      - { type: jsonpath, path: "$[1].n", operator: eq, expected: "10" }
    failPolicy: continue

  - label: A page beyond the last is refused
    request: { method: GET, url: "{{baseUrl}}/features/links/items?page=4&per_page=4" }
    assertions:
      - { type: status, operator: eq, expected: 400 }
    failPolicy: continue
