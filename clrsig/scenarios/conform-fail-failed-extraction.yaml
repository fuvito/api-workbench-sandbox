schemaVersion: "1"
title: conform-fail - an extraction that finds nothing
description: >
  DELIBERATELY BROKEN. The only problem is that the extraction `nope` finds nothing in the response.
  Every assertion passes. Since 0.8.5 (F-032) a failed extraction fails the step: clrsig prints FAIL
  for the step, the headline says FAILED and the run exits 1.
steps:
  - label: extract nothing
    request: { method: GET, url: "{{baseUrl}}/health" }
    assertions:
      - { type: status, operator: eq, expected: 200 }
    extractions:
      - { name: nope, source: jsonpath, path: "$.not.there" }
    failPolicy: stop
