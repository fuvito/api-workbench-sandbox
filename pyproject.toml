[project]
name = "api-workbench-sandbox"
version = "0.1.0"
description = "ClearSignal test targets: ok, contract-fail and conform-fail REST API fixtures"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
